<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="ftitle fdesc">
  <title id="ftitle">Palatine seal</title>
  <desc id="fdesc">A dark wax seal of Frederick V, the Winter King, bearing a shield parted per pale: the gold Palatine lion on sable and the silver Bohemian lion on gules.</desc>
  <defs>
    <radialGradient id="fwax" cx="46%" cy="40%" r="64%">
      <stop offset="0" stop-color="#3a3c46"/><stop offset="0.58" stop-color="#23242c"/><stop offset="1" stop-color="#15161c"/>
    </radialGradient>
    <filter id="frough"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="24"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <!-- Rampant lion silhouette: rearing on hind legs, forelegs raised, head up, tail over back. -->
    <path id="frampant" d="M44 92
      C44 92 42 84 40 80
      C46 82 49 86 50 90
      C52 80 50 70 47 64
      C45 58 46 52 50 49
      C48 53 49 58 52 60
      C53 54 57 50 62 49
      C58 47 56 42 58 38
      C56 39 53 39 51 37
      C54 35 58 35 61 36
      C60 32 62 28 66 27
      C64 25 63 21 65 18
      C66 21 68 23 70 23
      C70 19 73 16 77 16
      C75 13 76 9 80 8
      C79 11 80 14 83 15
      C86 13 90 14 92 17
      C89 17 86 18 85 21
      C88 21 91 23 91 27
      C88 25 85 25 82 26
      C84 29 84 33 82 36
      C81 32 79 30 76 30
      C78 34 78 39 75 42
      C73 39 71 37 68 37
      C70 42 69 48 65 51
      C70 50 75 51 78 55
      C74 54 70 55 67 58
      C72 59 76 62 78 67
      C73 64 68 63 64 65
      C68 68 70 73 70 79
      C66 75 62 73 58 74
      C61 78 62 83 60 88
      C58 84 55 81 52 81
      C53 85 52 90 49 93
      Z" />
  </defs>

  <!-- Wax disc + rim -->
  <circle cx="110" cy="110" r="96" fill="url(#fwax)" filter="url(#frough)"/>
  <circle cx="110" cy="110" r="80" fill="none" stroke="#d8b45a" stroke-width="4"/>
  <circle cx="110" cy="110" r="74" fill="none" stroke="#0c0d12" stroke-width="2" opacity="0.6"/>

  <!-- Crown above the shield -->
  <g transform="translate(110,46)" fill="#e0bc63" stroke="#9a7a2e" stroke-width="0.6">
    <path d="M-16 6 L-16 -2 L-9 4 L0 -6 L9 4 L16 -2 L16 6 Z"/>
    <circle cx="-16" cy="-3" r="2.2"/><circle cx="0" cy="-8" r="2.4"/><circle cx="16" cy="-3" r="2.2"/>
    <rect x="-17" y="6" width="34" height="4" rx="1.5"/>
  </g>

  <!-- Heater shield, parted per pale -->
  <g transform="translate(110,118)">
    <!-- shield outline path reused for clip + stroke -->
    <defs>
      <clipPath id="fshield">
        <path d="M-40 -42 L40 -42 L40 -4 C40 24 22 42 0 50 C-22 42 -40 24 -40 -4 Z"/>
      </clipPath>
    </defs>

    <!-- field fills clipped to shield -->
    <g clip-path="url(#fshield)">
      <!-- dexter (viewer left): sable -->
      <rect x="-40" y="-42" width="40" height="94" fill="#1a1b21"/>
      <!-- sinister (viewer right): gules -->
      <rect x="0" y="-42" width="40" height="94" fill="#a52630"/>

      <!-- Palatine lion: gold, on dexter, facing inward (to dexter = right within its half, but heraldic dexter faces viewer-left edge); rendered facing center-right -->
      <use href="#frampant" transform="translate(-44,-40) scale(0.62)" fill="#e0bc63"/>
      <!-- small gold crown on Palatine lion -->
      <path transform="translate(-24,-30)" d="M-5 0 L-5 -3 L-2 -1 L0 -4 L2 -1 L5 -3 L5 0 Z" fill="#e0bc63"/>

      <!-- Bohemian lion: silver, on sinister, mirrored to face inward; double-tailed -->
      <g transform="translate(44,0) scale(-1,1)">
        <use href="#frampant" transform="translate(-44,-40) scale(0.62)" fill="#dfe2e4"/>
        <!-- second (forked) tail flick -->
        <path transform="translate(-44,-40) scale(0.62)" d="M44 92 C40 86 38 78 41 72 C42 78 45 84 49 88 Z" fill="#dfe2e4"/>
      </g>
      <!-- gold crown on Bohemian lion -->
      <path transform="translate(24,-30)" d="M-5 0 L-5 -3 L-2 -1 L0 -4 L2 -1 L5 -3 L5 0 Z" fill="#e0bc63"/>
    </g>

    <!-- per-pale gold dividing line -->
    <line x1="0" y1="-42" x2="0" y2="49" stroke="#d8b45a" stroke-width="1.6"/>
    <!-- shield gold outline -->
    <path d="M-40 -42 L40 -42 L40 -4 C40 24 22 42 0 50 C-22 42 -40 24 -40 -4 Z"
          fill="none" stroke="#d8b45a" stroke-width="2.4"/>
  </g>

  <text x="110" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#e0bc63" letter-spacing="4">1619</text>
</svg>
