<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a walled town">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>

  <!-- walled town silhouette, centred -->
  <g fill="#1c140f">
    <rect x="330" y="74" width="220" height="34"/>
    <rect x="330" y="68" width="10" height="8"/><rect x="350" y="68" width="10" height="8"/>
    <rect x="370" y="68" width="10" height="8"/><rect x="500" y="68" width="10" height="8"/>
    <rect x="520" y="68" width="10" height="8"/><rect x="540" y="68" width="10" height="8"/>
    <!-- left gate tower -->
    <rect x="386" y="52" width="28" height="56"/>
    <polygon points="384,52 400,34 416,52"/>
    <!-- right gate tower -->
    <rect x="466" y="52" width="28" height="56"/>
    <polygon points="464,52 480,34 496,52"/>
    <!-- central cathedral spire -->
    <rect x="432" y="44" width="16" height="64"/>
    <polygon points="430,44 440,18 450,44"/>
    <!-- background roofs -->
    <polygon points="352,74 364,60 376,74"/>
    <polygon points="504,74 516,60 528,74"/>
  </g>
  <!-- gate arch + windows carved back to the ground -->
  <g fill="#d2c198">
    <path d="M446 108 v-20 a14 14 0 0 0 -28 0 v20 z"/>
    <rect x="396" y="64" width="8" height="12"/><rect x="476" y="64" width="8" height="12"/>
    <rect x="436" y="56" width="8" height="10"/>
  </g>

  <!-- flanking ground rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="108" x2="330" y2="108"/><line x1="550" y1="108" x2="860" y2="108"/>
  </g>
  <line x1="330" y1="108" x2="550" y2="108" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4">
    <line x1="11" y1="115" x2="869" y2="115"/>
  </g>
</svg>
