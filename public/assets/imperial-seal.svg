<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Imperial chancery seal</title>
  <desc id="desc">A wax seal bearing the double-headed imperial eagle for the Empire in Ashes game interface.</desc>
  <defs>
    <radialGradient id="wax" cx="46%" cy="40%" r="64%">
      <stop offset="0" stop-color="#b83232"/>
      <stop offset="0.58" stop-color="#7d151c"/>
      <stop offset="1" stop-color="#3b0b12"/>
    </radialGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="24"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <circle cx="110" cy="110" r="96" fill="url(#wax)" filter="url(#rough)"/>
  <circle cx="110" cy="110" r="80" fill="none" stroke="#d8b45a" stroke-width="4"/>
  <circle cx="110" cy="110" r="74" fill="none" stroke="#2d0b12" stroke-width="2" opacity="0.6"/>

  <!-- double-headed eagle, struck in gold -->
  <g fill="#e0bc63">
    <!-- crown -->
    <path d="M98 60 l4 -11 l8 6 l8 -6 l4 11 l-3 7 l-18 0z"/>
    <circle cx="110" cy="46" r="3"/>
    <!-- heads + necks facing outward -->
    <path d="M104 72 q-9 -1 -14 -9 q-6 5 -13 3 q4 6 11 6 q-9 4 -17 1 q7 7 18 6 q-2 4 2 8 l13 -5z"/>
    <polygon points="78,70 66,72 78,76"/>
    <path d="M116 72 q9 -1 14 -9 q6 5 13 3 q-4 6 -11 6 q9 4 17 1 q-7 7 -18 6 q2 4 -2 8 l-13 -5z"/>
    <polygon points="142,70 154,72 142,76"/>
    <!-- spread wings -->
    <path d="M102 90 q-20 -12 -44 -8 q13 6 14 12 q-22 -6 -38 4 q16 6 24 8 q-18 1 -28 12 q19 4 34 0 q-13 7 -20 18 q22 -3 38 -16 q-3 11 -11 19 q18 -6 27 -23z"/>
    <path d="M118 90 q20 -12 44 -8 q-13 6 -14 12 q22 -6 38 4 q-16 6 -24 8 q18 1 28 12 q-19 4 -34 0 q13 7 20 18 q-22 -3 -38 -16 q3 11 11 19 q-18 -6 -27 -23z"/>
    <!-- body + tail -->
    <path d="M99 90 q11 -6 22 0 q5 24 -2 44 q5 7 4 16 l-13 7 l-13 -7 q-1 -9 4 -16 q-7 -20 -2 -44z"/>
  </g>

  <text x="110" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#e0bc63" letter-spacing="4">1618</text>
</svg>
