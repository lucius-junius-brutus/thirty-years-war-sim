<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a marching host of pikemen">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>

  <!-- forest of pikes: a column of marching infantry, raked diagonally -->
  <g stroke="#1c140f" stroke-width="2.5" stroke-linecap="round">
    <line x1="300" y1="96" x2="318" y2="20"/><line x1="330" y1="96" x2="348" y2="24"/>
    <line x1="360" y1="96" x2="378" y2="18"/><line x1="390" y1="96" x2="408" y2="26"/>
    <line x1="420" y1="96" x2="438" y2="20"/><line x1="450" y1="96" x2="468" y2="24"/>
    <line x1="480" y1="96" x2="498" y2="18"/><line x1="510" y1="96" x2="528" y2="26"/>
    <line x1="540" y1="96" x2="558" y2="22"/><line x1="570" y1="96" x2="588" y2="20"/>
  </g>
  <!-- pike heads -->
  <g fill="#1c140f">
    <polygon points="318,20 314,30 322,30"/><polygon points="348,24 344,34 352,34"/>
    <polygon points="378,18 374,28 382,28"/><polygon points="408,26 404,36 412,36"/>
    <polygon points="438,20 434,30 442,30"/><polygon points="468,24 464,34 472,34"/>
    <polygon points="498,18 494,28 502,28"/><polygon points="528,26 524,36 532,36"/>
    <polygon points="558,22 554,32 562,32"/><polygon points="588,20 584,30 592,30"/>
  </g>
  <!-- a standard / banner amid the column -->
  <g fill="#1c140f">
    <line x1="444" y1="96" x2="444" y2="12" stroke="#1c140f" stroke-width="3"/>
    <path d="M444 16 h40 l-10 9 l10 9 h-40 z"/>
  </g>
  <!-- massed ranks (silhouetted bodies on the march) -->
  <g fill="#1c140f">
    <path d="M298 108 q6 -22 16 -22 q10 0 16 22 z"/>
    <path d="M326 108 q6 -24 16 -24 q10 0 16 24 z"/>
    <path d="M356 108 q6 -22 16 -22 q10 0 16 22 z"/>
    <path d="M386 108 q6 -24 16 -24 q10 0 16 24 z"/>
    <path d="M416 108 q6 -22 16 -22 q10 0 16 22 z"/>
    <path d="M474 108 q6 -24 16 -24 q10 0 16 24 z"/>
    <path d="M504 108 q6 -22 16 -22 q10 0 16 22 z"/>
    <path d="M534 108 q6 -24 16 -24 q10 0 16 24 z"/>
    <path d="M564 108 q6 -22 16 -22 q10 0 16 22 z"/>
    <ellipse cx="314" cy="84" rx="6" ry="7"/><ellipse cx="342" cy="82" rx="6" ry="7"/>
    <ellipse cx="372" cy="84" rx="6" ry="7"/><ellipse cx="402" cy="82" rx="6" ry="7"/>
    <ellipse cx="432" cy="84" rx="6" ry="7"/><ellipse cx="490" cy="82" rx="6" ry="7"/>
    <ellipse cx="520" cy="84" rx="6" ry="7"/><ellipse cx="550" cy="82" rx="6" ry="7"/>
    <ellipse cx="580" cy="84" rx="6" ry="7"/>
  </g>

  <!-- flanking ground rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="108" x2="296" y2="108"/><line x1="584" y1="108" x2="860" y2="108"/>
  </g>
  <line x1="296" y1="108" x2="584" y2="108" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4">
    <line x1="11" y1="115" x2="869" y2="115"/>
  </g>
</svg>
