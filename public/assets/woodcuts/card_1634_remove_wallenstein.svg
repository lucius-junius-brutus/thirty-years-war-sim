<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of an imperial proscription patent with pendant seal, crossed halberds, and a broken commander's baton, marking the killing of Wallenstein">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>

  <!-- central motif: imperial proscription patent, crossed halberds behind, broken baton -->
  <g fill="#1c140f">
    <!-- crossed halberds behind the document -->
    <g stroke="#1c140f" stroke-width="4" fill="none">
      <line x1="360" y1="100" x2="520" y2="22"/>
      <line x1="520" y1="100" x2="360" y2="22"/>
    </g>
    <!-- halberd heads (blocky axe blades + spikes) -->
    <polygon points="356,24 372,14 380,30 366,40"/>
    <polygon points="524,24 508,14 500,30 514,40"/>
    <rect x="361" y="10" width="4" height="16" transform="rotate(-25 363 18)"/>
    <rect x="515" y="10" width="4" height="16" transform="rotate(25 517 18)"/>

    <!-- the patent: a hanging sheet of parchment, slightly curled -->
    <path d="M392,30 L488,30 L488,98 Q466,104 440,100 Q414,104 392,98 Z"/>

    <!-- broken commander's baton laid across the foot, snapped in two -->
    <g>
      <rect x="372" y="92" width="44" height="9" transform="rotate(-9 394 96)"/>
      <rect x="464" y="92" width="44" height="9" transform="rotate(9 486 96)"/>
      <polygon points="416,86 432,99 420,101 410,93"/>
      <polygon points="464,86 448,99 460,101 470,93"/>
    </g>

    <!-- pendant wax seal hung from the document on a cord -->
    <line x1="440" y1="98" x2="440" y2="108" stroke="#1c140f" stroke-width="3"/>
    <circle cx="440" cy="115" r="10"/>
  </g>

  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- "DEAD OR ALIVE" rules gouged across the patent (no letters, just lines of text) -->
    <line x1="402" y1="42" x2="478" y2="42"/>
    <line x1="402" y1="50" x2="478" y2="50"/>
    <line x1="402" y1="58" x2="466" y2="58"/>
    <line x1="408" y1="66" x2="472" y2="66"/>
    <line x1="408" y1="74" x2="458" y2="74"/>
    <!-- gouged sheen on the curled lower edge -->
    <path d="M398,96 Q418,101 440,98 Q462,101 482,96"/>
    <!-- impressed device on the wax seal (cross + bar) -->
    <line x1="440" y1="110" x2="440" y2="120"/>
    <line x1="435" y1="115" x2="445" y2="115"/>
    <!-- glints on the halberd blades -->
    <line x1="361" y1="22" x2="372" y2="18"/>
    <line x1="519" y1="22" x2="508" y2="18"/>
    <!-- splinter cut at the baton's break -->
    <line x1="418" y1="90" x2="426" y2="98"/>
    <line x1="462" y1="90" x2="454" y2="98"/>
  </g>

  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
