<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of the Blood Court: a headsman with raised axe stands over a block on a scaffold before a watching crowd in Prague's Old Town Square">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: the scaffold, block, headsman and crowd -->
  <g fill="#1c140f">
    <!-- watching crowd, massed heads behind the scaffold (left) -->
    <circle cx="312" cy="86" r="7"/><circle cx="328" cy="90" r="7"/>
    <circle cx="344" cy="85" r="7"/><circle cx="320" cy="100" r="7"/>
    <circle cx="338" cy="101" r="7"/>
    <rect x="306" y="92" width="46" height="22" rx="3"/>
    <!-- watching crowd (right) -->
    <circle cx="540" cy="86" r="7"/><circle cx="556" cy="90" r="7"/>
    <circle cx="524" cy="89" r="7"/><circle cx="548" cy="101" r="7"/>
    <circle cx="530" cy="101" r="7"/>
    <rect x="518" y="92" width="46" height="22" rx="3"/>
    <!-- raised pikes / halberds of the guard flanking the scaffold -->
    <rect x="300" y="40" width="3" height="56"/><polygon points="294,40 309,40 301,28"/>
    <rect x="563" y="40" width="3" height="56"/><polygon points="557,40 572,40 564,28"/>
    <!-- the scaffold platform -->
    <rect x="356" y="92" width="156" height="10"/>
    <rect x="362" y="102" width="8" height="10"/><rect x="498" y="102" width="8" height="10"/>
    <!-- the block -->
    <rect x="424" y="80" width="30" height="14" rx="2"/>
    <rect x="430" y="76" width="18" height="6"/>
    <!-- the kneeling condemned rebel, bowed over the block -->
    <path d="M408 80 q6 -18 22 -16 l4 12 q-12 2 -18 12 z"/>
    <circle cx="424" cy="78" r="6"/>
    <!-- the headsman, broad and dark, beside the block -->
    <rect x="470" y="44" width="24" height="40" rx="3"/>
    <circle cx="482" cy="40" r="9"/>
    <!-- headsman's near arm raising the axe haft -->
    <rect x="478" y="30" width="6" height="22" transform="rotate(28 481 41)"/>
    <!-- the broad-bladed executioner's axe, lifted high -->
    <rect x="486" y="16" width="5" height="34" transform="rotate(22 488 33)"/>
    <path d="M492 16 q22 -6 26 12 q-16 2 -28 0 z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged sheen along the axe blade -->
    <path d="M498 16 q14 0 18 10"/>
    <!-- fold-cuts in the headsman's cloak -->
    <line x1="476" y1="52" x2="476" y2="80"/><line x1="488" y1="50" x2="488" y2="80"/>
    <!-- gouge across the block and the bowed cloth -->
    <line x1="428" y1="86" x2="450" y2="86"/>
    <line x1="414" y1="74" x2="424" y2="82"/>
    <!-- glints on the raised pike heads -->
    <line x1="301" y1="32" x2="301" y2="38"/><line x1="564" y1="32" x2="564" y2="38"/>
    <!-- cut marks separating heads in the crowd -->
    <line x1="320" y1="84" x2="320" y2="94"/><line x1="548" y1="84" x2="548" y2="94"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
