<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of an elector's cap and sceptre passing from one princely hand to another, the Palatine dignity transferred to Bavaria">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>

  <!-- central motif: the dignity passing hand to hand -->
  <g fill="#1c140f">
    <!-- left princely sleeve/hand, offering up (the Palatine, dispossessed) -->
    <path d="M308 104 L322 78 L342 80 L356 70 L372 78 L368 92 L350 96 L344 104 Z"/>
    <!-- left forearm cuff blocks -->
    <path d="M306 104 L318 84 L330 90 L320 104 Z"/>
    <!-- right princely sleeve/hand, receiving (Bavaria) -->
    <path d="M572 104 L558 78 L538 80 L524 70 L508 78 L512 92 L530 96 L536 104 Z"/>
    <path d="M574 104 L562 84 L550 90 L560 104 Z"/>

    <!-- sceptre laid across, between the hands -->
    <rect x="372" y="60" width="136" height="6"/>
    <!-- sceptre finial (left) -->
    <path d="M368 56 L380 50 L388 58 L382 68 L370 66 Z"/>
    <!-- sceptre fleuron head (right) -->
    <path d="M512 62 L506 50 L514 44 L522 50 L516 62 Z"/>
    <path d="M504 56 L498 62 L506 64 Z M520 56 L526 62 L518 64 Z"/>

    <!-- the elector's cap held aloft at centre: crowned ermine cap -->
    <!-- cushion of the cap -->
    <path d="M404 50 Q440 38 476 50 L476 56 Q440 50 404 56 Z"/>
    <!-- the rounded cap body -->
    <path d="M410 50 Q412 18 440 14 Q468 18 470 50 Z"/>
    <!-- the closing arch of the cap (electoral bonnet) -->
    <path d="M414 30 Q440 12 466 30 L466 36 Q440 22 414 36 Z"/>
    <!-- orb and cross atop the cap -->
    <circle cx="440" cy="12" r="6"/>
    <rect x="437" y="0" width="6" height="10"/>
    <rect x="431" y="3" width="18" height="5"/>

    <!-- two shields below the rule, the houses exchanged -->
    <path d="M392 90 L420 90 L420 102 Q406 114 392 102 Z"/>
    <path d="M460 90 L488 90 L488 102 Q474 114 460 102 Z"/>
  </g>

  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged ermine pattern on the cap -->
    <line x1="426" y1="44" x2="426" y2="48"/>
    <line x1="440" y1="42" x2="440" y2="46"/>
    <line x1="454" y1="44" x2="454" y2="48"/>
    <line x1="433" y1="36" x2="433" y2="39"/>
    <line x1="447" y1="36" x2="447" y2="39"/>
    <!-- shine on the arch -->
    <path d="M420 30 Q440 18 460 30" stroke-width="1.4"/>
    <!-- cross glint -->
    <line x1="440" y1="2" x2="440" y2="8"/>
    <!-- gleam along the sceptre shaft -->
    <line x1="380" y1="62" x2="500" y2="62" stroke-width="1.2"/>
    <!-- knuckle cuts on the hands -->
    <line x1="346" y1="84" x2="358" y2="80"/>
    <line x1="350" y1="90" x2="362" y2="86"/>
    <line x1="534" y1="84" x2="522" y2="80"/>
    <line x1="530" y1="90" x2="518" y2="86"/>
    <!-- cloth folds on the sleeves -->
    <line x1="316" y1="96" x2="326" y2="84"/>
    <line x1="564" y1="96" x2="554" y2="84"/>
    <!-- division mark on the shields -->
    <line x1="406" y1="92" x2="406" y2="106"/>
    <line x1="474" y1="92" x2="474" y2="106"/>
  </g>

  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
