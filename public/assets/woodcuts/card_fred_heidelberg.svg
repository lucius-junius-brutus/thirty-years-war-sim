<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of Heidelberg castle-town stormed and burning above the river Neckar, its tower toppling in smoke">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: the stormed, burning castle-town on the Neckar -->
  <g fill="#1c140f">
    <!-- rising smoke billows over the town -->
    <path d="M360 40 q-12 -16 4 -26 q-6 -16 14 -16 q10 -12 24 -2 q16 -8 18 8 q14 2 6 16 q8 12 -8 14 q-4 10 -18 4 q-12 8 -22 -2 q-16 4 -18 -8 z"/>
    <path d="M470 44 q-10 -14 6 -22 q-4 -14 14 -12 q10 -10 20 0 q14 -4 12 12 q10 6 -2 16 q2 12 -14 8 q-10 8 -20 -2 q-14 0 -10 -16 z"/>
    <!-- castle rock / town mass on the hill -->
    <path d="M338 96 L342 78 L360 70 L360 56 L412 56 L412 70 L500 70 L500 50 L520 50 L520 96 Z"/>
    <!-- toppling great tower, leaning into the smoke -->
    <path d="M404 56 L398 24 L416 22 L426 54 Z"/>
    <!-- crenellated wall teeth along the rampart -->
    <path d="M362 56 h8 v-6 h8 v6 h8 v-6 h8 v6 h8 v-6 h8 v6 h8"/>
    <path d="M468 50 h6 v-6 h7 v6 h6 v-6 h7 v6 h6"/>
    <!-- gabled roofs of the burning town below the keep -->
    <path d="M430 70 L444 56 L458 70 Z"/>
    <path d="M448 70 L462 58 L476 70 Z"/>
    <!-- the Neckar bank: massed pikes and a standard of the storming host -->
    <g stroke="#1c140f" stroke-width="2.4">
      <line x1="346" y1="108" x2="342" y2="80"/>
      <line x1="354" y1="108" x2="352" y2="76"/>
      <line x1="362" y1="108" x2="360" y2="82"/>
      <line x1="524" y1="108" x2="528" y2="78"/>
      <line x1="532" y1="108" x2="534" y2="74"/>
    </g>
    <!-- standard pole and pennon planted at the breach -->
    <rect x="490" y="40" width="3" height="56"/>
    <path d="M493 42 L516 48 L493 56 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour: flame-licks, gouged stone, smoke curls -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- flame slashes leaping from the keep -->
    <path d="M404 54 q4 -10 -2 -16 q8 4 6 -6 q6 8 0 14"/>
    <path d="M452 66 q3 -8 -2 -12 q7 3 4 -5 q5 6 1 11"/>
    <!-- gouged courses of stone in the rock -->
    <line x1="346" y1="84" x2="372" y2="80"/>
    <line x1="478" y1="86" x2="512" y2="84"/>
    <line x1="380" y1="92" x2="470" y2="92"/>
    <!-- smoke curls scored into the billows -->
    <path d="M372 22 q10 -6 18 2"/>
    <path d="M484 26 q9 -5 16 1"/>
    <!-- highlight on the leaning tower face -->
    <line x1="408" y1="50" x2="404" y2="28"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
