<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of the Augsburg Settlement: a sealed peace document with a torn lower corner and a broken pendant seal, flanked by crossed quills">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- crossed quills behind the document (flanking the settlement) -->
  <g fill="#1c140f">
    <polygon points="332,30 342,34 372,84 366,88"/>
    <polygon points="548,30 538,34 508,84 514,88"/>
  </g>
  <!-- central motif: the sealed peace charter with a torn lower corner -->
  <g fill="#1c140f">
    <!-- the parchment sheet as an ink silhouette; torn bottom-right corner left open -->
    <polygon points="372,24 508,24 508,96 452,96 440,86 372,96"/>
    <!-- top binding band of the charter -->
    <rect x="372" y="24" width="136" height="9"/>
    <!-- pendant cord descending from the charter to the seal -->
    <rect x="466" y="96" width="6" height="14"/>
    <!-- the great wax seal, broken: a notch cut from its rim -->
    <circle cx="469" cy="118" r="13"/>
    <polygon points="469,118 482,112 482,124" fill="#d2c198"/>
    <!-- a fracture line splitting the seal -->
  </g>
  <!-- carved highlights cut BACK to the ground colour: lines of the broken clause, gouged plumes, cracked wax -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- ruled lines of text on the charter -->
    <line x1="384" y1="42" x2="496" y2="42"/>
    <line x1="384" y1="50" x2="496" y2="50"/>
    <line x1="384" y1="58" x2="496" y2="58"/>
    <!-- the silenced clause: a line that breaks off mid-stroke -->
    <line x1="384" y1="66" x2="438" y2="66"/>
    <line x1="384" y1="74" x2="470" y2="74"/>
    <!-- gouged quill vanes -->
    <line x1="340" y1="40" x2="362" y2="76" stroke-width="1.2"/>
    <line x1="540" y1="40" x2="518" y2="76" stroke-width="1.2"/>
    <!-- crack across the broken seal -->
    <line x1="460" y1="110" x2="478" y2="126" stroke-width="1.2"/>
    <!-- nib splits on the quills -->
    <line x1="369" y1="86" x2="365" y2="83"/>
    <line x1="511" y1="86" x2="515" y2="83"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
