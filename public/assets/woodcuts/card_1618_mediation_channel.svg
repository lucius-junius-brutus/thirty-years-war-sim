<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of two envoys facing across a negotiating table set with a sealed paper, a quill, and an unbroken seal between them">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <path d="M250 64 l-10 -6 v12 z" fill="#1c140f"/><path d="M630 64 l10 -6 v12 z" fill="#1c140f"/>
  </g>
  <!-- central motif, ink fills, centred at x=440 -->
  <g fill="#1c140f">
    <!-- the long negotiating table -->
    <rect x="330" y="86" width="220" height="10"/>
    <polygon points="330,96 550,96 540,108 340,108"/>
    <rect x="344" y="96" width="9" height="12"/><rect x="527" y="96" width="9" height="12"/>
    <!-- table cloth fringe -->
    <path d="M330 86 h220 v4 h-220 z"/>
    <!-- left envoy: cloaked, hat, leaning in -->
    <path d="M362 86 c-4,-22 4,-34 14,-36 l8,-12 8,12 c10,2 16,14 12,36 z"/>
    <circle cx="382" cy="40" r="9"/>
    <path d="M368 36 q14,-12 28,0 l-3,-6 q-11,-7 -22,0 z"/>
    <!-- left envoy gesturing arm toward the paper -->
    <path d="M396 56 l34,18 -4,8 -34,-18 z"/>
    <!-- right envoy: cloaked, hat, leaning in (mirror) -->
    <path d="M518 86 c4,-22 -4,-34 -14,-36 l-8,-12 -8,12 c-10,2 -16,14 -12,36 z"/>
    <circle cx="498" cy="40" r="9"/>
    <path d="M484 36 q14,-12 28,0 l-3,-6 q-11,-7 -22,0 z"/>
    <!-- right envoy arm toward paper -->
    <path d="M484 56 l-34,18 4,8 34,-18 z"/>
    <!-- the sealed settlement on the table, centred -->
    <rect x="420" y="74" width="40" height="14"/>
    <rect x="416" y="72" width="48" height="4"/>
    <!-- pendant wax seal hung from the document -->
    <line x1="440" y1="88" x2="440" y2="98" stroke="#1c140f" stroke-width="2"/>
    <circle cx="440" cy="102" r="7"/>
    <!-- crossed quill laid over the paper, still resting, unsigned -->
    <path d="M414 80 l40 -22 3 4 -40 22 z"/>
    <path d="M457 56 l8 -4 -2 8 z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged folds in left cloak -->
    <line x1="372" y1="58" x2="370" y2="82"/>
    <line x1="384" y1="56" x2="384" y2="84"/>
    <!-- gouged folds in right cloak -->
    <line x1="508" y1="58" x2="510" y2="82"/>
    <line x1="496" y1="56" x2="496" y2="84"/>
    <!-- hatband cuts -->
    <line x1="374" y1="35" x2="390" y2="35"/>
    <line x1="490" y1="35" x2="506" y2="35"/>
    <!-- ruled lines on the unsigned document -->
    <line x1="424" y1="78" x2="456" y2="78"/>
    <line x1="424" y1="82" x2="452" y2="82"/>
    <!-- glint cut into the wax seal -->
    <line x1="438" y1="100" x2="442" y2="104"/>
    <!-- table edge highlight -->
    <line x1="340" y1="88" x2="540" y2="88"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
