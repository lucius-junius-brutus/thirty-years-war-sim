<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a field marshal's baton of supreme command held aloft from a draped throne, crossed with an army standard, granting one man near-sovereign authority over the army">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <path d="M300 64 l-14 -5 0 10 z"/><path d="M580 64 l14 -5 0 10 z"/>
  </g>
  <!-- central motif: throne-canopy of granted command, baton aloft crossed with army standard -->
  <g fill="#1c140f">
    <!-- canopy valance over the seat of authority -->
    <path d="M348 22 L532 22 L532 34 L348 34 Z"/>
    <path d="M348 34 L362 47 L376 34 L390 47 L404 34 L418 47 L432 34 L446 47 L460 34 L474 47 L488 34 L502 47 L516 34 L532 47 L532 34 Z"/>
    <!-- canopy crown peg -->
    <rect x="436" y="14" width="8" height="10"/>
    <!-- backing cloth of state, draped -->
    <path d="M392 34 L488 34 L482 96 L398 96 Z"/>
    <!-- army standard, staff crossing up-left, banner flying -->
    <rect x="318" y="40" width="6" height="62" transform="rotate(22 321 71)"/>
    <path d="M335 44 L398 56 L392 74 L329 62 Z"/>
    <circle cx="307" cy="33" r="5"/>
    <!-- field marshal's baton of supreme command, aloft up-right -->
    <rect x="500" y="34" width="9" height="66" rx="3" transform="rotate(-20 504 67)"/>
    <rect x="497" y="30" width="15" height="9" transform="rotate(-20 504 34)"/>
    <rect x="510" y="92" width="15" height="9" transform="rotate(-20 517 96)"/>
    <!-- studding on the baton -->
    <circle cx="514" cy="52" r="2.4"/><circle cx="520" cy="70" r="2.4"/>
    <!-- helm of command set upon the cloth -->
    <path d="M414 60 q26 -16 52 0 l-2 14 q-24 10 -48 0 Z"/>
    <rect x="416" y="74" width="48" height="8"/>
    <!-- sealing knot / cord of office -->
    <circle cx="440" cy="92" r="8"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged drape folds -->
    <line x1="408" y1="40" x2="404" y2="92"/>
    <line x1="426" y1="40" x2="424" y2="92"/>
    <line x1="456" y1="40" x2="458" y2="92"/>
    <line x1="474" y1="40" x2="478" y2="92"/>
    <!-- baton sheen -->
    <line x1="506" y1="44" x2="498" y2="88"/>
    <!-- banner ripple -->
    <line x1="344" y1="50" x2="386" y2="58"/>
    <line x1="340" y1="58" x2="382" y2="66"/>
    <!-- helm visor cuts -->
    <line x1="424" y1="63" x2="456" y2="63"/>
    <line x1="426" y1="69" x2="454" y2="69"/>
    <!-- knot highlight -->
    <line x1="436" y1="90" x2="444" y2="94"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
