<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a balance scale weighing a sword against a sealed charter, a conqueror's choice between war and law">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <path d="M250 64 l-12 -6 v12 z" fill="#1c140f" stroke="none"/>
    <path d="M630 64 l12 -6 v12 z" fill="#1c140f" stroke="none"/>
  </g>
  <!-- central motif: the balance of war and law, centred at x=440 -->
  <g fill="#1c140f">
    <!-- the beam post rising from a stepped plinth -->
    <rect x="436" y="26" width="8" height="60"/>
    <!-- pivot fulcrum knob -->
    <polygon points="440,18 432,30 448,30"/>
    <circle cx="440" cy="32" r="5"/>
    <!-- the balance beam, tilted: sword pan (left) sinks lower than charter pan (right) -->
    <polygon points="358,42 522,30 522,36 358,48"/>
    <!-- left suspension chains -->
    <line x1="362" y1="46" x2="350" y2="70" stroke="#1c140f" stroke-width="1.6"/>
    <line x1="372" y1="45" x2="382" y2="70" stroke="#1c140f" stroke-width="1.6"/>
    <!-- right suspension chains -->
    <line x1="510" y1="32" x2="500" y2="56" stroke="#1c140f" stroke-width="1.6"/>
    <line x1="520" y1="31" x2="530" y2="56" stroke="#1c140f" stroke-width="1.6"/>
    <!-- left pan, the sword of conquest, hanging lower -->
    <path d="M338 70 a28 12 0 0 0 56 0 z"/>
    <!-- sword laid across the left pan -->
    <rect x="334" y="62" width="64" height="5"/>
    <rect x="358" y="50" width="6" height="14"/>
    <polygon points="396,57 412,64 396,71"/>
    <!-- right pan, the charter of settlement, riding higher -->
    <path d="M488 56 a28 12 0 0 0 56 0 z"/>
    <!-- rolled charter on the right pan with pendant seal -->
    <rect x="498" y="40" width="36" height="14" rx="2"/>
    <ellipse cx="498" cy="47" rx="4" ry="7"/>
    <ellipse cx="534" cy="47" rx="4" ry="7"/>
    <line x1="516" y1="54" x2="516" y2="66" stroke="#1c140f" stroke-width="1.6"/>
    <circle cx="516" cy="71" r="6"/>
    <!-- stepped stone plinth beneath the post -->
    <rect x="416" y="86" width="48" height="8"/>
    <rect x="406" y="94" width="68" height="9"/>
    <!-- crown of the conqueror resting on the plinth foot -->
    <polygon points="424,86 428,76 434,84 440,74 446,84 452,76 456,86"/>
    <rect x="424" y="86" width="32" height="4"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged fuller down the sword blade -->
    <line x1="340" y1="64" x2="392" y2="64"/>
    <!-- chased edge of the beam -->
    <line x1="366" y1="44" x2="516" y2="33"/>
    <!-- ribbing across the rolled charter -->
    <line x1="504" y1="44" x2="504" y2="50"/>
    <line x1="514" y1="44" x2="514" y2="50"/>
    <line x1="524" y1="44" x2="524" y2="50"/>
    <!-- glint on the pendant seal and pan rims -->
    <line x1="513" y1="69" x2="519" y2="69"/>
    <line x1="350" y1="74" x2="382" y2="74"/>
    <line x1="500" y1="60" x2="532" y2="60"/>
    <!-- carved points of the crown -->
    <line x1="430" y1="82" x2="440" y2="78"/>
    <line x1="450" y1="82" x2="440" y2="78"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
