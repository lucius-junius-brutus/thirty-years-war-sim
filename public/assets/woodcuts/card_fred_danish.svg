<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of Christian IV of Denmark on horseback leading a marching column of pikes and banners into war">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: crowned king on horseback leading a marching column -->
  <g fill="#1c140f">
    <!-- a forest of upright pikes behind the column (the army marching) -->
    <g stroke="#1c140f" stroke-width="2.4">
      <line x1="486" y1="78" x2="490" y2="22"/>
      <line x1="502" y1="78" x2="505" y2="16"/>
      <line x1="518" y1="78" x2="520" y2="24"/>
      <line x1="534" y1="78" x2="535" y2="14"/>
      <line x1="550" y1="78" x2="549" y2="26"/>
      <line x1="566" y1="78" x2="563" y2="18"/>
    </g>
    <!-- pike heads (blocky angular leaf-blades) -->
    <path d="M490 22 l-4 9 4 4 4 -4 z"/>
    <path d="M505 16 l-4 9 4 4 4 -4 z"/>
    <path d="M520 24 l-4 9 4 4 4 -4 z"/>
    <path d="M535 14 l-4 9 4 4 4 -4 z"/>
    <path d="M549 26 l-4 9 4 4 4 -4 z"/>
    <path d="M563 18 l-4 9 4 4 4 -4 z"/>
    <!-- Frederick's banner carried at the head, on a tall staff -->
    <line x1="470" y1="80" x2="470" y2="12" stroke="#1c140f" stroke-width="3"/>
    <path d="M470 14 l44 6 -44 18 z"/>
    <!-- column of marching soldiers (blocky silhouettes) behind the horse -->
    <g>
      <rect x="488" y="60" width="11" height="22"/><path d="M488 60 l5.5 -8 5.5 8 z"/>
      <rect x="506" y="62" width="11" height="20"/><path d="M506 62 l5.5 -8 5.5 8 z"/>
      <rect x="524" y="60" width="11" height="22"/><path d="M524 60 l5.5 -8 5.5 8 z"/>
      <rect x="542" y="62" width="11" height="20"/><path d="M542 62 l5.5 -8 5.5 8 z"/>
      <rect x="560" y="60" width="11" height="22"/><path d="M560 60 l5.5 -8 5.5 8 z"/>
    </g>
    <!-- the king's horse, bold heraldic silhouette, striding left -->
    <path d="M398 96
             l4 -16 -6 -10 4 -6 8 6 6 -2
             l6 -22 8 -8 14 -2 16 4
             l10 0 4 6 -2 8 -10 4 -8 -2
             l-4 14 2 18 6 6 -2 6 -10 0 -2 -10
             l-14 0 -2 10 -10 0 -2 -10
             l-12 0 -4 10 -10 0 z" />
    <!-- horse tail -->
    <path d="M470 56 l16 -6 6 10 -8 6 -10 -4 z"/>
    <!-- the crowned king mounted -->
    <g>
      <!-- torso / cloak -->
      <path d="M430 50 l8 -6 14 0 8 8 -2 18 -28 0 z"/>
      <!-- head -->
      <circle cx="444" cy="38" r="8"/>
      <!-- crown atop the head (blocky points) -->
      <path d="M435 33 l0 -8 4 4 5 -6 5 6 4 -4 0 8 z"/>
      <!-- raised sword / commander's baton aloft -->
      <line x1="458" y1="46" x2="478" y2="20" stroke="#1c140f" stroke-width="4"/>
    </g>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged plumage on the banner / fly folds -->
    <line x1="478" y1="20" x2="500" y2="24"/>
    <line x1="476" y1="26" x2="496" y2="29"/>
    <!-- muscling carved into the horse's flank and chest -->
    <line x1="418" y1="64" x2="440" y2="66"/>
    <line x1="420" y1="72" x2="446" y2="74"/>
    <line x1="408" y1="80" x2="418" y2="78"/>
    <!-- the horse's eye and brow -->
    <line x1="405" y1="74" x2="409" y2="74"/>
    <!-- crown points caught in light -->
    <line x1="439" y1="29" x2="444" y2="27"/>
    <line x1="449" y1="29" x2="453" y2="27"/>
    <!-- cloak fold -->
    <line x1="436" y1="52" x2="450" y2="56"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
