<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a crown held aloft beneath a great cathedral arch at the coronation of Frederick in Prague, an emptied image niche at one side">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: cathedral arch, an emptied niche, two hands raising a crown -->
  <g fill="#1c140f">
    <!-- great church: twin gothic piers framing a pointed arch over the rite -->
    <path d="M330 110 L330 40 Q330 22 358 22 L358 110 Z"/>
    <path d="M550 110 L550 40 Q550 22 522 22 L522 110 Z"/>
    <!-- pointed arch spanning the nave -->
    <path d="M358 40 Q440 -2 522 40 L522 48 Q440 12 358 48 Z"/>
    <!-- spire keystone above the arch crown -->
    <path d="M432 18 L440 2 L448 18 Z"/>
    <!-- emptied image niche in the left pier (Calvinist stripping) -->
    <path d="M337 50 Q337 42 347 42 Q357 42 357 50 L357 82 L337 82 Z"/>
    <!-- right pier: a saint's blind figure-slab, plain block where an image stood -->
    <rect x="525" y="48" width="20" height="36"/>
    <!-- altar step / dais beneath the crowning -->
    <rect x="392" y="98" width="96" height="8"/>
    <rect x="404" y="92" width="72" height="6"/>
    <!-- two raised hands offering the crown aloft -->
    <path d="M404 92 L412 66 L420 64 L424 78 Z"/>
    <path d="M476 92 L468 66 L460 64 L456 78 Z"/>
    <!-- forearms / cuffed sleeves -->
    <path d="M404 96 L398 108 L412 108 L416 96 Z"/>
    <path d="M476 96 L482 108 L468 108 L464 96 Z"/>
    <!-- the crown held between the hands -->
    <path d="M418 60 L462 60 L460 50 L450 58 L444 46 L436 46 L430 58 L420 50 Z"/>
    <rect x="418" y="60" width="44" height="8"/>
    <!-- jewel bosses on the band -->
    <circle cx="430" cy="64" r="2.4"/><circle cx="440" cy="64" r="2.4"/><circle cx="450" cy="64" r="2.4"/>
    <!-- cross orb crowning the peak -->
    <rect x="438" y="38" width="4" height="9"/><rect x="435" y="41" width="10" height="3"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged grooves down the piers (stone courses) -->
    <line x1="344" y1="40" x2="344" y2="108"/><line x1="536" y1="40" x2="536" y2="108"/>
    <line x1="333" y1="58" x2="357" y2="58"/><line x1="333" y1="74" x2="357" y2="74"/>
    <line x1="523" y1="58" x2="547" y2="58"/><line x1="523" y1="74" x2="547" y2="74"/>
    <!-- voussoir cuts along the arch -->
    <line x1="392" y1="22" x2="398" y2="34"/><line x1="440" y1="10" x2="440" y2="24"/>
    <line x1="488" y1="22" x2="482" y2="34"/>
    <!-- crown band reflection and point edges -->
    <line x1="424" y1="64" x2="456" y2="64"/>
    <line x1="436" y1="48" x2="438" y2="56"/><line x1="444" y1="48" x2="442" y2="56"/>
    <!-- hollow of the emptied niche, scraped bare -->
    <line x1="347" y1="50" x2="347" y2="80"/>
    <!-- knuckle cuts on the raised hands -->
    <line x1="410" y1="74" x2="416" y2="72"/><line x1="470" y1="74" x2="464" y2="72"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
