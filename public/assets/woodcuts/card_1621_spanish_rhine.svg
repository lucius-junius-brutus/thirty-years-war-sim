<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a column of Spanish tercio pikemen marching the Spanish Road along the Rhine, standards raised">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: the marching column of tercio pikes receding up the Rhine road -->
  <g fill="#1c140f">
    <!-- the winding Spanish Road, a wedge narrowing toward the horizon -->
    <polygon points="306,108 574,108 470,58 430,58"/>
    <!-- river bank stones flanking the road -->
    <polygon points="300,108 312,96 320,108"/>
    <polygon points="560,108 572,96 580,108"/>
    <!-- far ranks of pikes, dense thicket receding to horizon -->
    <g stroke="#1c140f" stroke-width="1">
      <line x1="436" y1="60" x2="438" y2="48"/><line x1="442" y1="60" x2="443" y2="47"/>
      <line x1="448" y1="60" x2="448" y2="46"/><line x1="454" y1="60" x2="453" y2="47"/>
      <line x1="460" y1="60" x2="458" y2="48"/>
    </g>
    <!-- middle ranks: pike block -->
    <g stroke="#1c140f" stroke-width="1.6">
      <line x1="418" y1="82" x2="420" y2="56"/><line x1="427" y1="82" x2="428" y2="54"/>
      <line x1="436" y1="82" x2="436" y2="53"/><line x1="445" y1="82" x2="444" y2="54"/>
      <line x1="454" y1="82" x2="452" y2="56"/><line x1="463" y1="82" x2="460" y2="58"/>
    </g>
    <!-- two great regimental standards rising from the column -->
    <line x1="408" y1="90" x2="404" y2="40" stroke="#1c140f" stroke-width="3"/>
    <polygon points="404,40 380,46 404,56"/>
    <line x1="472" y1="90" x2="476" y2="42" stroke="#1c140f" stroke-width="3"/>
    <polygon points="476,42 500,48 476,58"/>
    <!-- front rank: three blocky tercio pikemen silhouettes -->
    <g>
      <!-- pikeman A -->
      <rect x="356" y="74" width="16" height="26"/>
      <circle cx="364" cy="68" r="7"/>
      <polygon points="364,61 356,66 372,66"/>
      <line x1="372" y1="100" x2="370" y2="40" stroke="#1c140f" stroke-width="2.4"/>
      <!-- pikeman B -->
      <rect x="384" y="76" width="16" height="24"/>
      <circle cx="392" cy="70" r="7"/>
      <polygon points="392,63 384,68 400,68"/>
      <line x1="400" y1="100" x2="399" y2="38" stroke="#1c140f" stroke-width="2.4"/>
      <!-- pikeman C (drummer/officer, broader) -->
      <rect x="450" y="74" width="18" height="26"/>
      <circle cx="459" cy="68" r="7"/>
      <polygon points="459,60 449,66 469,66"/>
      <line x1="450" y1="100" x2="448" y2="38" stroke="#1c140f" stroke-width="2.4"/>
      <line x1="468" y1="100" x2="470" y2="40" stroke="#1c140f" stroke-width="2.4"/>
      <!-- pikeman D -->
      <rect x="478" y="76" width="16" height="24"/>
      <circle cx="486" cy="70" r="7"/>
      <polygon points="486,63 478,68 494,68"/>
      <line x1="478" y1="100" x2="479" y2="38" stroke="#1c140f" stroke-width="2.4"/>
    </g>
    <!-- shore: low Rhine ripples -->
    <g stroke="#1c140f" stroke-width="1.4" fill="none" opacity="0.4">
      <path d="M300,103 q10,-4 20,0 t20,0"/>
      <path d="M540,103 q10,-4 20,0 t20,0"/>
    </g>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged road centre line -->
    <line x1="440" y1="104" x2="446" y2="64"/>
    <!-- cut folds on the standards (cloth) -->
    <line x1="386" y1="50" x2="400" y2="52"/>
    <line x1="494" y1="52" x2="480" y2="54"/>
    <!-- helmet glints / armour cuts on front pikemen -->
    <line x1="361" y1="66" x2="367" y2="66"/>
    <line x1="389" y1="68" x2="395" y2="68"/>
    <line x1="456" y1="66" x2="462" y2="66"/>
    <line x1="483" y1="68" x2="489" y2="68"/>
    <line x1="360" y1="80" x2="368" y2="80"/>
    <line x1="455" y1="80" x2="463" y2="80"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
