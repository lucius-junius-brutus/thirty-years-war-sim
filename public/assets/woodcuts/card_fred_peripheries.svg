<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a distant walled frontier town across a river, two messengers riding out with standards toward the marches of Silesia and Moravia">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: a far frontier town on a hill, two riders carrying standards into the marches -->
  <g fill="#1c140f">
    <!-- distant walled town on a height, set back to the right -->
    <path d="M488 60 L488 44 L560 44 L560 60 Z"/>
    <!-- town wall battlements -->
    <path d="M488 44 L488 38 L494 38 L494 44 M500 44 L500 38 L506 38 L506 44 M512 44 L512 38 L518 38 L518 44 M524 44 L524 38 L530 38 L530 44 M536 44 L536 38 L542 38 L542 44 M548 44 L548 38 L554 38 L554 44"/>
    <!-- two town towers with conical roofs -->
    <path d="M500 38 L500 24 L514 24 L514 38 Z"/>
    <path d="M500 24 L507 12 L514 24 Z"/>
    <path d="M534 38 L534 26 L548 26 L548 38 Z"/>
    <path d="M534 26 L541 14 L548 26 Z"/>
    <!-- the hill the town stands on -->
    <path d="M470 60 L488 50 L560 50 L578 60 Z"/>
    <!-- river band crossing below the town -->
    <path d="M306 78 Q400 70 470 76 Q540 82 574 76 L574 84 Q540 90 470 84 Q400 78 306 86 Z"/>
    <!-- first messenger: horse and rider, nearer, carrying a standard, riding away to the right -->
    <path d="M330 98 L330 80 L352 80 L356 86 L368 86 L368 92 L360 92 L356 98 L350 98 L350 90 L342 90 L342 98 Z"/>
    <path d="M330 80 L324 74 L322 80 Z"/>
    <ellipse cx="345" cy="74" rx="6" ry="7"/>
    <rect x="350" y="50" width="3" height="26"/>
    <path d="M353 50 L378 54 L353 62 Z"/>
    <!-- second messenger: smaller, further along the road toward the town -->
    <path d="M410 92 L410 80 L426 80 L429 84 L438 84 L438 89 L432 89 L429 92 L424 92 L424 86 L418 86 L418 92 Z"/>
    <ellipse cx="421" cy="76" rx="4" ry="5"/>
    <rect x="425" y="60" width="2" height="18"/>
    <path d="M427 60 L444 63 L427 69 Z"/>
    <!-- winding road from riders up to the town -->
    <path d="M396 100 Q440 92 470 78 L474 80 Q442 96 400 102 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouge plumes of standards -->
    <line x1="358" y1="54" x2="370" y2="56"/>
    <line x1="431" y1="63" x2="439" y2="65"/>
    <!-- cut marks on the river to suggest current -->
    <line x1="330" y1="81" x2="360" y2="79"/>
    <line x1="400" y1="78" x2="440" y2="80"/>
    <line x1="490" y1="80" x2="520" y2="78"/>
    <!-- light on town walls and tower roofs -->
    <line x1="503" y1="26" x2="503" y2="36"/>
    <line x1="537" y1="28" x2="537" y2="36"/>
    <line x1="494" y1="52" x2="494" y2="58"/>
    <!-- horse flanks -->
    <line x1="334" y1="84" x2="348" y2="84"/>
    <line x1="412" y1="84" x2="422" y2="84"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
