<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of the Swedish king Gustavus Adolphus, crowned and sword raised, arriving by sail to champion Frederick's restoration">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>

  <!-- central motif: ink fills -->
  <g fill="#1c140f">
    <!-- foreign aid by sea: two ships with bellied sails behind the king -->
    <!-- left ship -->
    <path d="M318 86 L372 86 L364 96 L326 96 Z"/>
    <rect x="343" y="50" width="3" height="36"/>
    <path d="M346 52 L368 58 L346 64 Z"/>
    <path d="M346 66 L366 72 L346 78 Z"/>
    <!-- right ship -->
    <path d="M512 88 L566 88 L558 98 L520 98 Z"/>
    <rect x="535" y="54" width="3" height="34"/>
    <path d="M519 60 L535 56 L535 70 Z"/>
    <path d="M519 74 L535 70 L535 82 Z"/>

    <!-- the Swedish king, centred at x=440 -->
    <!-- crown -->
    <path d="M424 30 L456 30 L453 18 L447 26 L440 16 L433 26 L427 18 Z"/>
    <rect x="423" y="30" width="34" height="5"/>
    <circle cx="427" cy="16" r="2"/><circle cx="440" cy="13" r="2"/><circle cx="453" cy="16" r="2"/>
    <!-- head -->
    <circle cx="440" cy="44" r="9"/>
    <!-- broad cloaked shoulders / armoured torso -->
    <path d="M412 96 L412 64 Q412 53 440 53 Q468 53 468 64 L468 96 Z"/>
    <!-- cloak sweeping out -->
    <path d="M412 64 L398 100 L412 100 Z"/>
    <path d="M468 64 L482 100 L468 100 Z"/>
    <!-- sword raised in right hand, blade aloft toward crown of the North -->
    <rect x="486" y="22" width="4" height="48"/>
    <path d="M482 70 L494 70 L488 78 Z"/>
    <rect x="478" y="68" width="20" height="4"/>
    <!-- arm to sword -->
    <path d="M463 66 L484 66 L484 74 L466 80 Z"/>
    <!-- left hand extended forward, offering / open palm (the offer of restoration) -->
    <path d="M414 70 L394 72 L392 80 L414 80 Z"/>
    <circle cx="391" cy="76" r="5"/>
  </g>

  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged plumage of the sails -->
    <line x1="350" y1="55" x2="362" y2="58"/><line x1="350" y1="61" x2="362" y2="61"/>
    <line x1="350" y1="69" x2="360" y2="72"/>
    <!-- carved armour folds on the torso -->
    <line x1="426" y1="62" x2="426" y2="92"/><line x1="440" y1="60" x2="440" y2="94"/>
    <line x1="454" y1="62" x2="454" y2="92"/>
    <!-- cloak gouges -->
    <line x1="408" y1="72" x2="404" y2="96"/><line x1="472" y1="72" x2="476" y2="96"/>
    <!-- crown band facets -->
    <line x1="430" y1="32" x2="430" y2="34"/><line x1="440" y1="32" x2="440" y2="34"/><line x1="450" y1="32" x2="450" y2="34"/>
    <!-- glint on the raised blade -->
    <line x1="488" y1="26" x2="488" y2="60"/>
    <!-- brow line on the king's face -->
    <line x1="435" y1="42" x2="445" y2="42"/>
  </g>

  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
