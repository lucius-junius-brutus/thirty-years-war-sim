<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of sealed appeals for foreign aid carried over the sea toward ships bound for England and the Dutch">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>

  <!-- central motif: sealed letters borne across the sea toward two ships -->
  <g fill="#1c140f">
    <!-- the sea: blocky waves running under the scene -->
    <path d="M305 96 q9 -8 18 0 q9 8 18 0 q9 -8 18 0 q9 8 18 0 q9 -8 18 0 q9 8 18 0
             q9 -8 18 0 q9 8 18 0 q9 -8 18 0 q9 8 18 0 q9 -8 18 0 q9 8 18 0
             q9 -8 18 0 q9 8 18 0 q9 -8 18 0 v10 h-288 z"/>

    <!-- left ship bound for England, bellied sails -->
    <path d="M330 78 l46 0 -8 12 -30 0 z"/>
    <rect x="352" y="44" width="3" height="34"/>
    <path d="M355 46 q26 6 24 26 l-24 0 z"/>
    <path d="M355 46 q-22 5 -20 22 l20 0 z"/>
    <path d="M353 40 l4 0 0 6 -4 0 z"/>

    <!-- right ship bound for the Dutch, bellied sails -->
    <path d="M512 80 l52 0 -9 13 -34 0 z"/>
    <rect x="538" y="42" width="3" height="38"/>
    <path d="M541 44 q30 7 27 30 l-27 0 z"/>
    <path d="M541 44 q-25 6 -22 25 l22 0 z"/>
    <path d="M539 37 l4 0 0 7 -4 0 z"/>

    <!-- two clasped hands passing the sealed letters at centre -->
    <!-- letter packet 1 -->
    <rect x="405" y="50" width="48" height="34"/>
    <!-- letter packet 2, offset behind -->
    <rect x="423" y="40" width="48" height="34"/>
    <!-- pendant wax seals on cords -->
    <line x1="429" y1="84" x2="429" y2="98" stroke="#1c140f" stroke-width="2.5"/>
    <circle cx="429" cy="101" r="7"/>
    <line x1="455" y1="74" x2="455" y2="90" stroke="#1c140f" stroke-width="2.5"/>
    <circle cx="455" cy="93" r="7"/>

    <!-- crossed quills above the packets -->
    <path d="M398 36 l36 22 -3 4 -36 -22 z"/>
    <path d="M478 36 l-36 22 3 4 36 -22 z"/>
  </g>

  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- folds gouged into the sails -->
    <path d="M360 50 q14 4 16 18"/>
    <path d="M548 48 q16 5 18 22"/>
    <path d="M350 52 q-13 4 -13 14"/>
    <!-- fold lines on the letter packets -->
    <line x1="413" y1="58" x2="445" y2="58"/>
    <line x1="413" y1="68" x2="445" y2="68"/>
    <line x1="431" y1="48" x2="463" y2="48"/>
    <line x1="431" y1="58" x2="463" y2="58"/>
    <!-- impressed device cut into each wax seal -->
    <path d="M426 98 l6 6 M432 98 l-6 6"/>
    <path d="M452 90 l6 6 M458 90 l-6 6"/>
    <!-- vane of the quills gouged -->
    <line x1="405" y1="41" x2="424" y2="52"/>
    <line x1="471" y1="41" x2="452" y2="52"/>
    <!-- crests cut into the waves -->
    <path d="M312 95 q9 -6 18 0 M348 95 q9 -6 18 0 M384 95 q9 -6 18 0"/>
    <path d="M456 95 q9 -6 18 0 M492 95 q9 -6 18 0 M528 95 q9 -6 18 0"/>
  </g>

  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
