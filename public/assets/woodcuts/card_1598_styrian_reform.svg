<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of reform commissioners closing a Protestant church by force: a barred and crossed church door, a stern commissioner with staff, and expelled preachers driven out past a heap of burning books">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif, ink fills -->
  <g fill="#1c140f">
    <!-- the closed Protestant church: blocky steepled body at centre-left -->
    <path d="M330 100 L330 50 L356 30 L382 50 L382 100 Z"/>
    <!-- steeple cross atop the gable -->
    <rect x="353" y="14" width="6" height="20"/>
    <rect x="346" y="20" width="20" height="5"/>
    <!-- the sealed/barred doorway, cut as a dark arch -->
    <path d="M344 100 L344 66 Q356 54 368 66 L368 100 Z"/>
    <!-- two crossed bars nailed across the door (closed by force) -->
    <rect x="340" y="72" width="32" height="6" transform="rotate(18 356 75)"/>
    <rect x="340" y="72" width="32" height="6" transform="rotate(-18 356 79)"/>
    <!-- reform commissioner, robed, with staff of office, before the door -->
    <path d="M400 100 L400 60 Q412 44 424 60 L424 100 Z"/>
    <circle cx="412" cy="50" r="9"/>
    <rect x="430" y="34" width="4" height="64"/>
    <circle cx="432" cy="32" r="6"/>
    <!-- garrison pike behind the commissioner -->
    <rect x="392" y="22" width="3" height="78"/>
    <path d="M388 22 L399 22 L393.5 10 Z"/>
    <!-- expelled preacher driven out at right, cloaked, stepping away -->
    <path d="M470 100 L466 64 Q478 48 492 62 L500 100 Z"/>
    <circle cx="481" cy="52" r="8"/>
    <!-- preacher's bundle on a stick over the shoulder -->
    <rect x="486" y="40" width="34" height="3" transform="rotate(-22 503 41)"/>
    <path d="M512 30 L528 30 L526 46 L514 46 Z"/>
    <!-- heap of cast-out books at the threshold, with flames -->
    <rect x="430" y="92" width="22" height="8"/>
    <rect x="436" y="84" width="22" height="8"/>
    <rect x="444" y="76" width="20" height="8"/>
    <path d="M438 76 L444 60 L450 72 L456 56 L462 74 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged stone courses on the church wall -->
    <line x1="330" y1="62" x2="382" y2="62"/>
    <line x1="330" y1="78" x2="344" y2="78"/>
    <line x1="368" y1="78" x2="382" y2="78"/>
    <line x1="332" y1="44" x2="356" y2="34"/>
    <!-- highlight along the nailed cross-bars -->
    <line x1="344" y1="73" x2="368" y2="80"/>
    <!-- folds in the commissioner's robe -->
    <line x1="408" y1="64" x2="406" y2="96"/>
    <line x1="416" y1="64" x2="418" y2="96"/>
    <!-- folds in the expelled preacher's cloak -->
    <line x1="476" y1="66" x2="474" y2="96"/>
    <line x1="486" y1="66" x2="490" y2="94"/>
    <!-- page-edges gouged into the book heap -->
    <line x1="432" y1="96" x2="450" y2="96"/>
    <line x1="438" y1="88" x2="456" y2="88"/>
    <line x1="446" y1="80" x2="462" y2="80"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
