<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a balance scale level above two cinched coin sacks, ready money in the imperial treasury">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: balance scale hung level over two coin sacks -->
  <g fill="#1c140f">
    <!-- standing post of the scale, rooted on the ground line -->
    <rect x="437" y="30" width="6" height="80"/>
    <!-- finial knop atop the post -->
    <circle cx="440" cy="28" r="6"/>
    <!-- the beam, level (equal weight, fair measure) -->
    <rect x="372" y="34" width="136" height="5"/>
    <!-- pivot boss -->
    <circle cx="440" cy="36" r="6"/>
    <!-- left suspension cords -->
    <polygon points="374,38 388,38 384,62 378,62"/>
    <!-- left pan -->
    <path d="M360 62 Q381 78 402 62 Z"/>
    <!-- right suspension cords -->
    <polygon points="492,38 506,38 502,62 496,62"/>
    <!-- right pan -->
    <path d="M458 62 Q479 78 500 62 Z"/>
    <!-- left coin sack, cinched, on the ground -->
    <path d="M348 108 Q344 80 360 74 Q352 68 368 64 Q384 68 376 74 Q392 80 388 108 Z"/>
    <!-- right coin sack, cinched, on the ground -->
    <path d="M492 108 Q488 80 504 74 Q496 68 512 64 Q528 68 520 74 Q536 80 532 108 Z"/>
    <!-- spilled coins between the sacks -->
    <circle cx="412" cy="103" r="6"/>
    <circle cx="428" cy="106" r="6"/>
    <circle cx="446" cy="104" r="6"/>
    <circle cx="464" cy="106" r="6"/>
    <!-- a counted coin resting in each pan -->
    <circle cx="381" cy="68" r="5"/>
    <circle cx="479" cy="68" r="5"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouge along the beam -->
    <line x1="378" y1="36" x2="502" y2="36"/>
    <!-- cinch-knot folds on the sacks -->
    <line x1="356" y1="76" x2="380" y2="76"/>
    <line x1="500" y1="76" x2="524" y2="76"/>
    <!-- belly folds gouged into each sack -->
    <line x1="356" y1="90" x2="382" y2="90"/>
    <line x1="358" y1="99" x2="380" y2="99"/>
    <line x1="500" y1="90" x2="526" y2="90"/>
    <line x1="502" y1="99" x2="524" y2="99"/>
    <!-- glint on the pan coins and spilled coins -->
    <line x1="379" y1="66" x2="383" y2="70"/>
    <line x1="477" y1="66" x2="481" y2="70"/>
    <line x1="410" y1="101" x2="414" y2="105"/>
    <line x1="462" y1="104" x2="466" y2="108"/>
    <!-- nick on the finial -->
    <line x1="438" y1="26" x2="442" y2="30"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
