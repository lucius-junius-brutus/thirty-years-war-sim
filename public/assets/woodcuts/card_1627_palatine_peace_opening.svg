<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of an exiled prince kneeling in submission, offering his crown upon a cushion before an empty imperial throne">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <path d="M250 64 l-10 -5 v10 z"/><path d="M630 64 l10 -5 v10 z"/>
  </g>
  <!-- central motif: empty imperial throne (right) + kneeling supplicant offering crown on cushion (left) -->
  <g fill="#1c140f">
    <!-- dais step under throne -->
    <rect x="498" y="100" width="86" height="8"/>
    <rect x="506" y="92" width="70" height="8"/>
    <!-- empty imperial throne, high-backed -->
    <path d="M512 92 V44 a30 30 0 0 1 60 0 V92 h-12 V58 h-36 V92 Z"/>
    <!-- throne arms -->
    <rect x="508" y="62" width="10" height="30"/>
    <rect x="566" y="62" width="10" height="30"/>
    <!-- finials topping the throne back -->
    <circle cx="518" cy="40" r="6"/><circle cx="566" cy="40" r="6"/>
    <!-- imperial orb-and-cross crowning the throne -->
    <circle cx="542" cy="34" r="7"/>
    <rect x="540" y="20" width="4" height="12"/>
    <rect x="535" y="24" width="14" height="4"/>
    <!-- kneeling supplicant, robed, bowed (Frederick) -->
    <!-- bent rear leg / kneeling mass of cloth -->
    <path d="M372 108 q4 -34 30 -40 q22 -4 30 14 q4 18 -14 26 l8 0 0 0 q-30 8 -54 0 Z"/>
    <!-- forward knee to ground -->
    <path d="M412 108 q-2 -16 12 -20 l10 18 Z"/>
    <!-- bowed torso leaning toward throne -->
    <path d="M398 70 q6 -18 26 -16 q16 4 14 22 q-2 12 -16 16 q-20 4 -24 -22 Z"/>
    <!-- bowed head -->
    <circle cx="430" cy="58" r="11"/>
    <!-- arms extended forward, lifting the cushion -->
    <path d="M438 64 q22 4 38 14 l-4 8 q-20 -10 -38 -12 Z"/>
    <!-- cushion offered up, tassels at corners -->
    <path d="M470 80 q26 -8 50 0 q4 8 -2 12 q-24 8 -48 0 q-4 -6 0 -12 Z"/>
    <circle cx="470" cy="92" r="3"/><circle cx="520" cy="92" r="3"/>
    <!-- the surrendered electoral crown resting on the cushion -->
    <path d="M482 78 h26 l-3 -14 -5 8 -5 -10 -5 10 -5 -8 Z"/>
    <circle cx="485" cy="62" r="2.5"/><circle cx="495" cy="59" r="2.5"/>
    <circle cx="505" cy="62" r="2.5"/>
    <!-- a proxy's hand reaching from behind the kneeler (submission by proxy) -->
    <path d="M360 78 q-14 -2 -22 6 l4 8 q12 -8 20 -4 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged folds in the supplicant's robe -->
    <path d="M384 100 q10 -22 28 -28"/>
    <path d="M392 104 q12 -20 30 -24"/>
    <line x1="406" y1="78" x2="416" y2="66"/>
    <!-- light along the bowed head/shoulder -->
    <path d="M422 54 q8 -6 16 -2"/>
    <!-- carved seams in the throne back -->
    <line x1="528" y1="58" x2="528" y2="90"/>
    <line x1="556" y1="58" x2="556" y2="90"/>
    <path d="M524 46 q18 -16 36 0"/>
    <!-- glint on the offered crown band -->
    <line x1="484" y1="76" x2="506" y2="76"/>
    <!-- highlight on cushion crease -->
    <path d="M474 86 q22 5 44 0"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
