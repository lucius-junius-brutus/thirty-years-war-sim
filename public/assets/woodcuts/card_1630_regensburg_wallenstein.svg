<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut: electors at Regensburg demand Wallenstein's dismissal, the surrendered general's baton passing from one hand to another over a council table">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <path d="M60 64 l14 -7 0 14 z" fill="#1c140f"/><path d="M820 64 l-14 -7 0 14 z" fill="#1c140f"/>
  </g>
  <!-- central motif, ink fills -->
  <g fill="#1c140f">
    <!-- council table slab spanning the centre -->
    <rect x="318" y="86" width="244" height="14"/>
    <rect x="320" y="100" width="240" height="6"/>
    <!-- three robed electors seated behind the table, left -->
    <path d="M334 86 l0 -22 q10 -16 22 0 l0 22 z"/>
    <circle cx="345" cy="40" r="9"/>
    <path d="M336 49 l18 0 -2 12 -14 0 z"/>
    <path d="M364 86 l0 -24 q11 -17 24 0 l0 24 z"/>
    <circle cx="376" cy="36" r="9"/>
    <path d="M367 45 l18 0 -2 13 -14 0 z"/>
    <!-- electoral cap with crosslet on the foremost left elector -->
    <path d="M369 28 l14 0 -2 -8 -10 0 z"/>
    <rect x="374" y="14" width="4" height="7"/><rect x="372" y="16" width="8" height="3"/>
    <!-- emperor figure, right, robed, hand giving up the baton -->
    <path d="M512 86 l0 -28 q14 -20 28 0 l0 28 z"/>
    <circle cx="526" cy="34" r="10"/>
    <!-- imperial crown arch -->
    <path d="M515 26 l22 0 -2 -9 -18 0 z"/>
    <path d="M517 17 q9 -10 18 0" fill="none" stroke="#1c140f" stroke-width="3"/>
    <circle cx="526" cy="11" r="2.5"/>
    <!-- emperor's arm reaching across, releasing the baton -->
    <path d="M512 60 q-28 6 -52 14 l4 8 q26 -8 50 -12 z"/>
    <!-- the surrendered general's baton, mid-air over the table -->
    <rect x="430" y="70" width="40" height="7" transform="rotate(-9 450 73)"/>
    <rect x="426" y="67" width="9" height="13" transform="rotate(-9 430 73)"/>
    <rect x="465" y="64" width="9" height="13" transform="rotate(-9 469 70)"/>
    <!-- electors' grasping hand reaching up for the baton -->
    <path d="M404 86 q12 -16 26 -18 l2 8 q-12 3 -20 14 z"/>
    <!-- a fallen sword laid on the table, blade across, disarmament -->
    <rect x="346" y="83" width="92" height="3"/>
    <rect x="438" y="80" width="6" height="9"/>
    <rect x="444" y="82" width="14" height="4"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged folds in the emperor's robe -->
    <line x1="520" y1="60" x2="522" y2="84"/>
    <line x1="532" y1="58" x2="534" y2="84"/>
    <!-- robe folds on the electors -->
    <line x1="344" y1="66" x2="345" y2="84"/>
    <line x1="376" y1="64" x2="377" y2="84"/>
    <!-- shine along the surrendered baton -->
    <line x1="434" y1="72" x2="466" y2="67"/>
    <!-- glint on the fallen sword blade -->
    <line x1="352" y1="84" x2="430" y2="84"/>
    <!-- table edge cut -->
    <line x1="322" y1="89" x2="558" y2="89"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
