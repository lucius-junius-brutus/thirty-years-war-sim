<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of estate hands offering scrolls of counsel up to a crowned cushion of the crown, a wasting trust shown by an hourglass">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif, ink fills, centred at x=440 -->
  <g fill="#1c140f">
    <!-- cushion bearing the crown, raised aloft as the object of trust -->
    <path d="M392 40 L488 40 L498 56 L382 56 Z"/>
    <!-- cushion tassels -->
    <path d="M382 56 L376 66 L386 64 Z"/>
    <path d="M498 56 L504 66 L494 64 Z"/>
    <!-- crown band -->
    <rect x="406" y="26" width="68" height="12"/>
    <!-- crown points with jewels -->
    <path d="M406 26 L412 8 L424 22 L440 6 L456 22 L468 8 L474 26 Z"/>
    <circle cx="440" cy="6" r="3"/><circle cx="412" cy="8" r="2.5"/><circle cx="468" cy="8" r="2.5"/>
    <!-- left offering hand with scroll of counsel rising from below -->
    <path d="M330 110 L344 92 L356 84 L372 80 L386 84 L380 94 L366 96 L356 102 L350 110 Z"/>
    <!-- left scroll held aloft -->
    <rect x="360" y="60" width="34" height="14" rx="6"/>
    <rect x="356" y="58" width="8" height="18" rx="4"/>
    <rect x="390" y="58" width="8" height="18" rx="4"/>
    <!-- right offering hand -->
    <path d="M550 110 L536 92 L524 84 L508 80 L494 84 L500 94 L514 96 L524 102 L530 110 Z"/>
    <!-- right scroll held aloft -->
    <rect x="486" y="60" width="34" height="14" rx="6"/>
    <rect x="482" y="58" width="8" height="18" rx="4"/>
    <rect x="516" y="58" width="8" height="18" rx="4"/>
    <!-- hourglass below crown: the wasting asset of trust -->
    <rect x="424" y="74" width="32" height="4"/>
    <rect x="424" y="100" width="32" height="4"/>
    <path d="M428 78 L452 78 L441 90 L440 90 Z"/>
    <path d="M440 90 L441 90 L452 102 L428 102 Z"/>
    <!-- draining sand mound, mostly run out -->
    <path d="M431 102 L449 102 L440 96 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged crown band facets -->
    <line x1="414" y1="32" x2="466" y2="32"/>
    <line x1="424" y1="20" x2="430" y2="14"/>
    <line x1="450" y1="20" x2="456" y2="14"/>
    <!-- cushion seam highlight -->
    <line x1="390" y1="48" x2="490" y2="48"/>
    <!-- scroll furl lines -->
    <line x1="364" y1="67" x2="390" y2="67"/>
    <line x1="490" y1="67" x2="516" y2="67"/>
    <!-- knuckle cuts on hands -->
    <line x1="352" y1="88" x2="366" y2="86"/>
    <line x1="528" y1="88" x2="514" y2="86"/>
    <!-- hourglass glass glint -->
    <line x1="433" y1="80" x2="438" y2="88"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
