<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a council table buried in unpaid bills beside an overturned empty paychest, with crossed pikes behind">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>

  <!-- central motif: ink fills -->
  <g fill="#1c140f">
    <!-- crossed mutinous pikes rising behind, with a tattered standard -->
    <polygon points="352,96 346,40 351,40 358,96"/>
    <polygon points="348,40 343,30 351,33 355,40"/>
    <polygon points="528,96 522,40 527,40 534,96"/>
    <polygon points="524,40 519,30 527,33 531,40"/>
    <polygon points="368,96 365,36 370,36 374,96"/>
    <polygon points="364,36 360,27 369,30 372,36"/>
    <polygon points="512,96 508,36 513,36 517,96"/>
    <polygon points="506,36 503,27 511,30 515,36"/>
    <!-- ragged standard flag -->
    <path d="M388,34 L430,30 L424,42 L432,52 L424,58 L416,50 L408,58 L400,48 L388,54 Z"/>
    <rect x="385" y="30" width="3" height="62"/>

    <!-- long council table -->
    <rect x="338" y="86" width="204" height="12"/>
    <polygon points="338,98 542,98 552,110 348,110"/>
    <!-- table legs -->
    <rect x="350" y="98" width="6" height="12"/>
    <rect x="524" y="98" width="6" height="12"/>

    <!-- heaped bills and ledgers piled on the table -->
    <polygon points="396,86 446,86 448,60 438,52 420,58 404,52 394,62"/>
    <polygon points="452,86 498,86 500,64 488,56 472,62 458,58 450,66"/>
    <polygon points="372,86 398,86 396,70 384,66 374,72"/>
    <!-- scattered sheets / curling pages -->
    <path d="M430,52 q8,-10 18,-4 q-6,2 -8,8 q-6,-2 -10,-4 Z"/>
    <path d="M470,56 q10,-8 18,0 q-7,1 -10,7 q-5,-4 -8,-7 Z"/>
    <path d="M408,60 q-9,-8 -18,-2 q7,1 9,7 q5,-3 9,-5 Z"/>

    <!-- overturned empty paychest, lid open, spilling nothing but a few coins -->
    <polygon points="486,98 532,98 528,78 490,78"/>
    <polygon points="486,78 528,78 522,70 492,70"/>
    <!-- open hinged lid flung back -->
    <polygon points="528,78 552,68 548,60 524,70"/>
    <!-- empty iron straps -->
    <rect x="500" y="78" width="3" height="20"/>
    <rect x="514" y="78" width="3" height="20"/>
    <!-- a meagre few coins fallen out -->
    <circle cx="538" cy="96" r="3"/>
    <circle cx="546" cy="92" r="2.5"/>
    <circle cx="532" cy="100" r="2.5"/>

    <!-- crossed quills laid across the bills, dry and idle -->
    <polygon points="356,82 410,60 412,64 360,86"/>
    <polygon points="360,82 412,58 414,62 364,86"/>
  </g>

  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged lines across stacked bills suggesting written ledgers -->
    <line x1="402" y1="70" x2="438" y2="70"/>
    <line x1="404" y1="76" x2="436" y2="76"/>
    <line x1="408" y1="82" x2="434" y2="82"/>
    <line x1="460" y1="72" x2="492" y2="72"/>
    <line x1="462" y1="78" x2="490" y2="78"/>
    <line x1="378" y1="76" x2="392" y2="76"/>
    <!-- chest grain and hollow shadow -->
    <line x1="494" y1="82" x2="524" y2="82"/>
    <line x1="494" y1="88" x2="524" y2="88"/>
    <line x1="494" y1="94" x2="524" y2="94"/>
    <!-- pike shaft glints -->
    <line x1="349" y1="50" x2="354" y2="90"/>
    <line x1="525" y1="50" x2="530" y2="90"/>
    <!-- coin shine -->
    <line x1="537" y1="95" x2="539" y2="95"/>
    <!-- standard fold -->
    <line x1="400" y1="38" x2="420" y2="36"/>
  </g>

  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
