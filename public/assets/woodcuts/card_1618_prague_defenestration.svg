<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of the Defenestration of Prague: two regents and a secretary pitched from a high castle window by an armed assembly">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: the Hradschin castle wall, a high window, figures pitched out -->
  <g fill="#1c140f">
    <!-- castle wall block, left of window -->
    <rect x="300" y="18" width="120" height="92"/>
    <!-- crenellations atop the wall -->
    <rect x="304" y="12" width="14" height="8"/><rect x="330" y="12" width="14" height="8"/>
    <rect x="356" y="12" width="14" height="8"/><rect x="382" y="12" width="14" height="8"/>
    <!-- the high window: deep ink reveal with stone surround -->
    <rect x="420" y="20" width="74" height="78"/>
    <!-- secretary already falling, head-down below the sill -->
    <path d="M455 100 l-9 18 -7 -3 6 -16 -10 5 -4 -7 11 -6 -7 -9 8 -4 6 9 7 -8 6 5 -6 9 9 4 -2 7z"/>
    <!-- first regent pitched out, tumbling -->
    <path d="M504 60 l16 -6 4 9 -12 5 14 7 -3 8 -14 -6 2 13 -9 1 -3 -14 -10 9 -6 -6 10 -9 -12 -3 2 -8 13 2 -1 -9 9 -1z"/>
    <!-- second regent at the sill, shoved through, legs kicking up -->
    <path d="M470 22 l8 -8 8 7 -3 7 9 -2 3 8 -9 3 7 8 -7 5 -7 -7 -2 12 -8 -1 1 -11 -8 6 -4 -6 9 -6 -6 -6 7 -7z"/>
    <!-- armed assembly: massed pike-staves rising at right inside the chamber -->
    <g stroke="#1c140f" stroke-width="3" fill="none">
      <line x1="498" y1="98" x2="486" y2="34"/><line x1="510" y1="98" x2="502" y2="30"/>
      <line x1="522" y1="98" x2="518" y2="36"/>
    </g>
    <!-- pike heads -->
    <path d="M486 34 l-4 8 8 0z"/><path d="M502 30 l-4 8 8 0z"/><path d="M518 36 l-4 8 8 0z"/>
    <!-- a hand thrust from the window, hurling -->
    <path d="M494 50 l14 -3 2 6 -8 2 6 5 -4 5 -8 -4 -1 7 -5 -1 1 -9 6 -2 -4 -6 5 -1z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- mortar courses gouged into the stone wall -->
    <line x1="302" y1="40" x2="418" y2="40"/><line x1="302" y1="62" x2="418" y2="62"/>
    <line x1="302" y1="84" x2="418" y2="84"/>
    <line x1="360" y1="20" x2="360" y2="40"/><line x1="340" y1="40" x2="340" y2="62"/>
    <line x1="380" y1="62" x2="380" y2="84"/><line x1="340" y1="84" x2="340" y2="110"/>
    <!-- window mullion and gouged depth -->
    <line x1="457" y1="20" x2="457" y2="98"/>
    <line x1="424" y1="58" x2="490" y2="58"/>
    <!-- folds in the falling regents' cloaks -->
    <line x1="510" y1="64" x2="516" y2="78"/><line x1="500" y1="68" x2="494" y2="80"/>
    <line x1="478" y1="28" x2="484" y2="40"/>
    <!-- glint on the secretary's tumbling robe -->
    <line x1="448" y1="106" x2="452" y2="116"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
