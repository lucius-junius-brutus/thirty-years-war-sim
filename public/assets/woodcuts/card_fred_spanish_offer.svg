<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a Spanish hand offering a key across a fork in the road while a renounced crown is set down upon a milestone">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <path d="M250 64 l-12 -7 v14 z" fill="#1c140f" stroke="none"/>
    <path d="M630 64 l12 -7 v14 z" fill="#1c140f" stroke="none"/>
  </g>
  <!-- central motif, ink fills -->
  <g fill="#1c140f">
    <!-- forking road meeting at a vanishing point, dividing the scene -->
    <path d="M438 110 L412 70 L424 70 L444 110 Z"/>
    <path d="M442 110 L470 70 L482 70 L466 110 Z"/>
    <!-- milestone on the right fork, crown renounced upon it -->
    <path d="M512 110 L512 86 L548 86 L548 110 Z"/>
    <path d="M512 86 L516 80 L544 80 L548 86 Z"/>
    <!-- the renounced crown set down on the milestone -->
    <path d="M510 80 L514 60 L522 72 L530 56 L538 72 L546 60 L550 80 Z"/>
    <circle cx="514" cy="58" r="3"/><circle cx="530" cy="54" r="3"/><circle cx="546" cy="58" r="3"/>
    <rect x="512" y="78" width="36" height="5"/>
    <!-- Spanish arm reaching from the left, sleeve and cuff -->
    <path d="M300 52 L356 60 L360 76 L308 70 Z"/>
    <path d="M356 56 L380 62 L382 78 L360 76 Z"/>
    <!-- the offered hand holding aloft a great key: the road home -->
    <path d="M382 60 L398 62 L404 70 L398 78 L382 76 Z"/>
    <!-- key bow (ring) -->
    <circle cx="416" cy="60" r="9"/>
    <circle cx="416" cy="60" r="3.5" fill="#d2c198"/>
    <!-- key shaft and ward, pointing toward the crown -->
    <rect x="424" y="57" width="74" height="6"/>
    <rect x="486" y="63" width="6" height="11"/>
    <rect x="474" y="63" width="6" height="8"/>
    <!-- distant foreign gable (the way home) low on the left horizon -->
    <path d="M300 96 L300 84 L320 84 L320 96 Z"/>
    <path d="M298 84 L310 74 L322 84 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged sleeve folds on the Spanish arm -->
    <line x1="312" y1="58" x2="350" y2="64"/>
    <line x1="316" y1="64" x2="352" y2="69"/>
    <!-- glint cut into the key shaft -->
    <line x1="430" y1="60" x2="482" y2="60"/>
    <!-- facets on the renounced crown -->
    <line x1="520" y1="74" x2="524" y2="64"/>
    <line x1="530" y1="72" x2="530" y2="60"/>
    <line x1="540" y1="74" x2="536" y2="64"/>
    <!-- chiselled stone of the milestone -->
    <line x1="518" y1="94" x2="542" y2="94"/>
    <line x1="530" y1="88" x2="530" y2="106"/>
    <!-- cart-ruts gouged down the forking road -->
    <line x1="430" y1="74" x2="442" y2="106"/>
    <line x1="460" y1="74" x2="452" y2="106"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
