<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of an open chamber door at the Leipzig assembly, robed Protestant princes turning toward the threshold of defection">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: an open chamber door, the threshold of defection -->
  <g fill="#1c140f">
    <!-- doorway pillars and lintel framing the open door -->
    <path d="M392 30 h26 v66 h-26 z"/>
    <path d="M468 30 h26 v66 h-26 z"/>
    <path d="M384 22 h118 v12 h-118 z"/>
    <!-- arched lintel keystone -->
    <path d="M436 12 l16 14 h-32 z"/>
    <!-- the open door, swung outward toward the viewer (left leaf) -->
    <path d="M392 32 L360 24 L360 102 L392 96 Z"/>
    <!-- door panels carved as recesses come from highlight cuts below -->
    <!-- dark threshold void beyond the door -->
    <path d="M418 34 h50 v62 h-50 z"/>
    <!-- a wavering princely figure on the threshold, mid-step out -->
    <path d="M430 44 a9 9 0 1 1 0.1 0 z"/>
    <path d="M422 62 q8 -8 18 0 l3 30 h-7 l-4 -16 -2 16 h-8 z"/>
    <!-- a second figure within, robed and seated, head bowed -->
    <path d="M452 50 a7 7 0 1 1 0.1 0 z"/>
    <path d="M445 66 q7 -7 15 0 l1 24 h-17 z"/>
    <!-- assembly table-edge before the door, low and blocky -->
    <path d="M340 100 h200 v6 h-200 z"/>
    <!-- a fallen seal / broken edict cast on the floor -->
    <circle cx="386" cy="103" r="6"/>
    <path d="M381 103 l-4 7 8 0 z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged plank lines on the open door leaf -->
    <line x1="368" y1="32" x2="368" y2="94"/>
    <line x1="378" y1="30" x2="378" y2="93"/>
    <!-- panel divisions of the doorway pillars -->
    <line x1="405" y1="38" x2="405" y2="90"/>
    <line x1="481" y1="38" x2="481" y2="90"/>
    <!-- fold of the threshold figure's cloak -->
    <line x1="431" y1="64" x2="431" y2="90"/>
    <line x1="436" y1="52" x2="430" y2="60"/>
    <!-- seated figure's robe fold -->
    <line x1="452" y1="68" x2="452" y2="88"/>
    <!-- glint along the lintel -->
    <line x1="388" y1="27" x2="498" y2="27"/>
    <!-- crack across the fallen seal -->
    <line x1="382" y1="100" x2="390" y2="106"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
