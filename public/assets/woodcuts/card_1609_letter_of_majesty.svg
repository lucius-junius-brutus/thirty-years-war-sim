<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of the Letter of Majesty: an unrolled royal charter with crossed quills and a pendant wax seal hanging from a cord">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
    <circle cx="280" cy="64" r="2.4" fill="#1c140f"/><circle cx="600" cy="64" r="2.4" fill="#1c140f"/>
  </g>
  <!-- central motif: the charter, crossed quills, pendant seal -->
  <g fill="#1c140f">
    <!-- crossed quills behind the document -->
    <polygon points="352,30 372,34 470,96 462,104 364,42"/>
    <polygon points="528,30 508,34 410,96 418,104 516,42"/>
    <!-- nib feet of the quills -->
    <polygon points="350,28 368,32 360,40"/>
    <polygon points="530,28 512,32 520,40"/>
    <!-- the unrolled charter sheet -->
    <path d="M372,40 L508,40 L508,98 L372,98 Z"/>
    <!-- rolled curl at the top edge -->
    <path d="M366,40 Q372,30 380,38 Q374,46 372,46 Z"/>
    <path d="M500,40 Q508,30 514,40 Q510,46 508,44 Z"/>
    <!-- rolled curl at the bottom edge -->
    <path d="M372,98 Q368,108 378,106 Q380,100 380,98 Z"/>
    <path d="M500,98 Q500,108 510,106 Q510,100 508,98 Z"/>
    <!-- cord descending from the charter to the pendant seal -->
    <path d="M440,98 L436,116 M440,98 L444,116" stroke="#1c140f" stroke-width="3" fill="none"/>
    <!-- pendant wax seal disc -->
    <circle cx="440" cy="118" r="9"/>
    <!-- twin shields flanking, two faiths set side by side -->
    <polygon points="338,58 358,58 358,72 348,82 338,72"/>
    <polygon points="522,58 542,58 542,72 532,82 522,72"/>
  </g>
  <!-- engraved hatching shading the charter face -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.34">
    <line x1="378" y1="50" x2="502" y2="50"/>
    <line x1="378" y1="58" x2="502" y2="58"/>
    <line x1="378" y1="66" x2="502" y2="66"/>
    <line x1="378" y1="74" x2="502" y2="74"/>
    <line x1="378" y1="82" x2="502" y2="82"/>
    <line x1="378" y1="90" x2="502" y2="90"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- script lines gouged into the charter -->
    <line x1="386" y1="54" x2="494" y2="54"/>
    <line x1="386" y1="62" x2="476" y2="62"/>
    <line x1="386" y1="70" x2="494" y2="70"/>
    <line x1="386" y1="78" x2="468" y2="78"/>
    <line x1="386" y1="86" x2="486" y2="86"/>
    <!-- feathering cut into the quill vanes -->
    <line x1="380" y1="52" x2="392" y2="44"/>
    <line x1="392" y1="60" x2="404" y2="52"/>
    <line x1="500" y1="52" x2="488" y2="44"/>
    <line x1="488" y1="60" x2="476" y2="52"/>
    <!-- emblem cross gouged into the wax seal -->
    <line x1="440" y1="112" x2="440" y2="124"/>
    <line x1="434" y1="118" x2="446" y2="118"/>
    <!-- charge marks on the twin shields -->
    <line x1="345" y1="63" x2="351" y2="63"/>
    <line x1="529" y1="63" x2="535" y2="63"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
