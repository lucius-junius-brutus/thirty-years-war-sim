<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a crowned king pulled between two armies — Spanish pikes invading the Palatinate in the west and Bohemian standards in the east">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>

  <!-- central motif: king torn between two fronts -->
  <g fill="#1c140f">
    <!-- WEST front: Spanish pike column leaning IN from the left (the Rhine invasion) -->
    <g>
      <polygon points="312,98 312,40 320,40 320,98"/>
      <polygon points="312,40 316,30 320,40"/>
      <polygon points="324,98 326,44 332,44 334,98"/>
      <polygon points="326,44 329,34 332,44"/>
      <polygon points="336,98 340,42 346,42 348,98"/>
      <polygon points="340,42 343,32 346,42"/>
      <!-- Spanish banner with cross, swinging toward the king -->
      <polygon points="320,40 358,30 356,52 320,56"/>
    </g>
    <!-- gabled town behind the western pikes (the Palatinate, under threat) -->
    <polygon points="306,98 306,72 322,60 338,72 338,98"/>
    <rect x="316" y="80" width="8" height="18"/>

    <!-- EAST front: Bohemian standard and massed pikes from the right -->
    <g>
      <polygon points="568,98 568,40 560,40 560,98"/>
      <polygon points="568,40 564,30 560,40"/>
      <polygon points="556,98 554,44 548,44 546,98"/>
      <polygon points="554,44 551,34 548,44"/>
      <polygon points="544,98 540,42 534,42 532,98"/>
      <polygon points="540,42 537,32 534,42"/>
      <!-- Bohemian banner, swinging toward the king -->
      <polygon points="560,40 522,30 524,52 560,56"/>
    </g>
    <!-- crowned hill behind the eastern pikes (Bohemia, the crown held) -->
    <polygon points="574,98 558,62 542,98"/>

    <!-- CENTRE: the king, a blocky crowned silhouette, pulled both ways -->
    <!-- cloak / body, torn at the hem to suggest the rift -->
    <polygon points="424,98 432,52 448,52 456,98 440,90"/>
    <!-- shoulders and head -->
    <circle cx="440" cy="44" r="11"/>
    <polygon points="426,58 454,58 458,72 422,72"/>
    <!-- crown above the head -->
    <polygon points="429,36 451,36 451,28 446,33 443,26 437,33 434,28 429,28"/>
    <!-- two arms reaching out to opposite fronts -->
    <polygon points="427,60 392,52 390,58 425,68"/>
    <polygon points="453,60 488,52 490,58 455,68"/>
    <!-- orb in one hand (the crown of Bohemia), sceptre toward the other -->
    <circle cx="389" cy="55" r="7"/>
    <rect x="486" y="40" width="4" height="22"/>
    <polygon points="483,40 493,40 488,32"/>
  </g>

  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged folds in the king's cloak -->
    <line x1="436" y1="62" x2="432" y2="92"/>
    <line x1="444" y1="62" x2="448" y2="92"/>
    <!-- the central tear pulling the hem apart -->
    <line x1="440" y1="70" x2="440" y2="90"/>
    <!-- facial light and crown rim -->
    <line x1="436" y1="42" x2="444" y2="42"/>
    <line x1="431" y1="34" x2="449" y2="34"/>
    <!-- plumb cuts on the two banners -->
    <line x1="328" y1="38" x2="350" y2="34"/>
    <line x1="552" y1="38" x2="530" y2="34"/>
    <!-- highlight on orb and sceptre head -->
    <line x1="386" y1="53" x2="392" y2="53"/>
    <line x1="486" y1="36" x2="490" y2="36"/>
  </g>

  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
