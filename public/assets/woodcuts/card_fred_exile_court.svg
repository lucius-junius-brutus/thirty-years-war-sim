<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of an exiled king's small canopied throne beneath a foreign Dutch gable at The Hague">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: foreign Dutch gable sheltering a small canopied throne -->
  <g fill="#1c140f">
    <!-- stepped Dutch crow-step gable behind, a foreign roof -->
    <path d="M364 96 L364 50 L380 50 L380 42 L396 42 L396 34 L412 34 L412 26 L440 18 L468 26 L468 34 L484 34 L484 42 L500 42 L500 50 L516 50 L516 96 Z"/>
    <!-- gable cut open to show interior ground -->
    <path d="M376 96 L376 58 L504 58 L504 96 Z" fill="#d2c198"/>
    <!-- canopy of estate over the throne -->
    <path d="M396 60 L484 60 L476 70 L404 70 Z"/>
    <!-- canopy valance teeth -->
    <path d="M404 70 L476 70 L472 78 L466 72 L460 78 L454 72 L448 78 L442 72 L436 78 L430 72 L424 78 L418 72 L412 78 L408 72 Z"/>
    <!-- canopy support posts -->
    <rect x="403" y="60" width="4" height="30"/><rect x="473" y="60" width="4" height="30"/>
    <!-- the throne: high blocky back -->
    <path d="M420 96 L420 74 L426 68 L454 68 L460 74 L460 96 Z"/>
    <!-- throne seat and arms -->
    <rect x="416" y="88" width="48" height="8"/>
    <rect x="416" y="80" width="6" height="12"/><rect x="458" y="80" width="6" height="12"/>
    <!-- a small crown set upon the empty seat: the claim kept alive -->
    <path d="M428 86 L428 80 L432 84 L436 78 L440 84 L444 78 L448 84 L452 80 L452 86 Z"/>
    <!-- charity alms-bowl at the foot of the throne -->
    <path d="M430 104 L450 104 L446 110 L434 110 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- gouged gable shading -->
    <line x1="372" y1="46" x2="372" y2="32"/>
    <line x1="508" y1="46" x2="508" y2="32"/>
    <!-- folds in the canopy cloth -->
    <line x1="418" y1="62" x2="414" y2="68"/>
    <line x1="440" y1="62" x2="440" y2="70"/>
    <line x1="462" y1="62" x2="466" y2="68"/>
    <!-- gleam on the throne back -->
    <line x1="432" y1="72" x2="432" y2="92"/>
    <line x1="448" y1="72" x2="448" y2="92"/>
    <!-- light on the crown -->
    <line x1="436" y1="80" x2="440" y2="84"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
