<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of the Bohemian Letter of Majesty being cut clause by clause beneath a toppling Protestant chapel, its pendant seal severed on the eve of revolt">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif: the charter sundered, chapel toppling -->
  <g fill="#1c140f">
    <!-- a small Protestant chapel behind, being pulled down (leaning, cracked) -->
    <path d="M328 70 L328 40 L342 28 L356 40 L356 70 Z"/>
    <rect x="335" y="50" width="14" height="20"/>
    <path d="M342 16 L346 28 L338 28 Z"/>
    <!-- crack / collapse: a chunk of wall tumbling -->
    <path d="M356 56 L372 60 L368 74 L354 70 Z"/>
    <!-- the great charter, a broad document, slashed across the middle -->
    <path d="M398 34 L520 34 L520 96 L398 96 Z"/>
    <!-- upper half lifted/peeling where it is cut -->
    <path d="M398 34 L520 34 L520 58 L460 62 L398 56 Z"/>
    <!-- the cut line carved as a jagged ink gap is done in highlights below -->
    <!-- pendant seal hanging, severed cord -->
    <circle cx="494" cy="104" r="11"/>
    <path d="M500 95 L508 84 L512 88 L504 99 Z"/>
    <!-- crossed blade and quill over the charter -->
    <path d="M430 22 L548 92 L544 98 L426 28 Z"/>
    <path d="M548 92 L560 96 L556 84 Z"/>
    <path d="M540 24 L452 96 L456 100 L544 28 Z"/>
    <path d="M540 24 L552 20 L548 32 Z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- ruled lines of script on the charter -->
    <line x1="408" y1="42" x2="500" y2="42"/>
    <line x1="408" y1="48" x2="486" y2="48"/>
    <line x1="408" y1="72" x2="498" y2="72"/>
    <line x1="408" y1="80" x2="476" y2="80"/>
    <line x1="408" y1="88" x2="492" y2="88"/>
    <!-- the severing cut, jagged, gouged through the parchment -->
    <path d="M398 60 L420 56 L440 64 L462 56 L484 64 L506 56 L520 62" stroke-width="3"/>
    <!-- emblem on the seal -->
    <circle cx="494" cy="104" r="5"/>
    <line x1="490" y1="100" x2="498" y2="108"/>
    <!-- gleam down the blade -->
    <line x1="438" y1="30" x2="540" y2="90"/>
    <!-- chapel stone courses, toppling timber -->
    <line x1="335" y1="58" x2="349" y2="58"/>
    <line x1="335" y1="64" x2="349" y2="64"/>
    <line x1="356" y1="46" x2="356" y2="68"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
