<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of a vassal's crown held aloft between two hands above a marching column of pikes, Frederick offered restoration as a Swedish client">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/><line x1="880" y1="105" x2="775" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- distant column of pikes marching through the lost lands (Swedish host) -->
  <g stroke="#1c140f" stroke-width="2.4">
    <line x1="322" y1="92" x2="318" y2="44"/><line x1="338" y1="92" x2="335" y2="40"/>
    <line x1="354" y1="92" x2="352" y2="46"/><line x1="370" y1="92" x2="369" y2="38"/>
    <line x1="386" y1="92" x2="386" y2="48"/>
    <line x1="494" y1="92" x2="494" y2="48"/><line x1="510" y1="92" x2="511" y2="38"/>
    <line x1="526" y1="92" x2="528" y2="46"/><line x1="542" y1="92" x2="545" y2="40"/>
    <line x1="558" y1="92" x2="562" y2="44"/>
  </g>
  <!-- central motif: two hands offering a crown aloft, ink fills, centred at x=440 -->
  <g fill="#1c140f">
    <!-- left forearm and hand reaching up from below -->
    <path d="M386 110 L398 110 L416 70 L408 64 L392 96 Z"/>
    <path d="M408 70 q14 -8 26 -3 l-2 11 q-12 -5 -23 2 Z"/>
    <!-- right forearm and hand reaching up from below -->
    <path d="M494 110 L482 110 L464 70 L472 64 L488 96 Z"/>
    <path d="M472 70 q-14 -8 -26 -3 l2 11 q12 -5 23 2 Z"/>
    <!-- crown circlet -->
    <path d="M404 56 L476 56 L472 70 L408 70 Z"/>
    <!-- crown points with jewels -->
    <path d="M408 56 L414 36 L424 56 Z"/>
    <path d="M428 56 L432 30 L440 56 Z"/>
    <path d="M440 56 L448 30 L452 56 Z"/>
    <path d="M456 56 L466 36 L472 56 Z"/>
    <circle cx="414" cy="34" r="4"/><circle cx="440" cy="28" r="4"/>
    <circle cx="466" cy="34" r="4"/>
    <!-- arched cap of the closed (royal) crown -->
    <path d="M414 38 Q440 22 466 38" fill="none" stroke="#1c140f" stroke-width="3"/>
    <circle cx="440" cy="20" r="5"/>
    <rect x="437" y="10" width="6" height="10"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged glints on the circlet band -->
    <line x1="412" y1="62" x2="428" y2="62"/>
    <line x1="448" y1="62" x2="466" y2="62"/>
    <!-- knuckle cuts on the hands -->
    <line x1="416" y1="66" x2="424" y2="63"/>
    <line x1="456" y1="66" x2="464" y2="63"/>
    <!-- highlight on the surmounting orb and points -->
    <line x1="438" y1="18" x2="438" y2="23"/>
    <line x1="431" y1="40" x2="436" y2="34"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
