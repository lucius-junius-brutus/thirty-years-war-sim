<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woodcut of Emperor Ferdinand kneeling before a crucifix as a Protestant deputy seizes him by the buttons and cavalry charges to his rescue">
  <rect width="880" height="128" fill="#d2c198"/>
  <!-- engraved sky hatching across the band -->
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.14">
    <line x1="0" y1="30" x2="30" y2="0"/><line x1="0" y1="55" x2="55" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="105" x2="105" y2="0"/>
    <line x1="880" y1="30" x2="850" y2="0"/><line x1="880" y1="55" x2="825" y2="0"/>
    <line x1="880" y1="80" x2="800" y2="0"/>
  </g>
  <!-- printer's frame -->
  <g stroke="#1c140f" fill="none">
    <rect x="5" y="5" width="870" height="118" stroke-width="3"/>
    <rect x="11" y="11" width="858" height="106" stroke-width="1"/>
  </g>
  <!-- flanking ornamental rules (safe to crop) -->
  <g stroke="#1c140f" stroke-width="2">
    <line x1="20" y1="64" x2="300" y2="64"/><line x1="580" y1="64" x2="860" y2="64"/>
    <circle cx="300" cy="64" r="4" fill="#1c140f"/><circle cx="580" cy="64" r="4" fill="#1c140f"/>
  </g>
  <!-- central motif, ink fills -->
  <g fill="#1c140f">
    <!-- crucifix on its stand, right of centre -->
    <rect x="516" y="24" width="6" height="64"/>
    <rect x="500" y="40" width="38" height="6"/>
    <!-- corpus on the cross, blocky silhouette -->
    <path d="M519 30 l4 6 -3 8 5 14 -6 10 -6 -10 5 -14 -3 -8z"/>
    <!-- kneeling emperor before the cross: robe as a heavy angular bell -->
    <path d="M470 108 L470 92 q4 -22 18 -28 l10 -2 8 6 4 14 2 18 z"/>
    <!-- imperial mantle fold -->
    <path d="M486 64 l16 -4 6 12 -4 20 -14 4z"/>
    <!-- bowed head and crown -->
    <circle cx="492" cy="60" r="9"/>
    <path d="M482 54 l4 -8 4 6 4 -8 4 8 4 -6 2 8z"/>
    <!-- clasped praying arms reaching to the cross -->
    <path d="M498 70 l16 -8 5 5 -16 11 z"/>
    <!-- deputy lunging from the left, seizing the emperor by the buttons -->
    <path d="M408 110 L408 78 q2 -16 16 -20 l12 0 6 8 -2 16 4 18 z"/>
    <!-- deputy head and flat hat -->
    <circle cx="426" cy="56" r="9"/>
    <rect x="414" y="44" width="26" height="5"/>
    <rect x="420" y="40" width="14" height="6"/>
    <!-- grasping arm thrust at the emperor's collar -->
    <path d="M438 60 l36 6 4 8 -38 -2 z"/>
    <!-- clenched fist clutching the buttons -->
    <circle cx="478" cy="68" r="6"/>
    <!-- a second deputy crowding behind, partial silhouette -->
    <path d="M388 110 L388 72 q2 -12 12 -14 l8 2 -2 14 2 30 z"/>
    <circle cx="402" cy="58" r="7"/>
    <!-- rescuing cavalry charging in from the right edge of the scene -->
    <path d="M548 108 q0 -22 16 -30 l18 -4 14 6 6 16 -4 12 -10 6 -6 -6 -8 4 z"/>
    <!-- horse head and arched neck -->
    <path d="M560 70 l-14 -8 -4 -10 6 -4 12 8 6 10z"/>
    <!-- rider with upright sabre -->
    <rect x="569" y="42" width="6" height="24"/>
    <circle cx="572" cy="40" r="6"/>
    <rect x="575" y="20" width="3" height="22" transform="rotate(18 576 31)"/>
    <!-- a raised standard among the horsemen -->
    <rect x="556" y="14" width="3" height="40"/>
    <path d="M559 16 l20 6 -20 8z"/>
  </g>
  <!-- carved highlights cut BACK to the ground colour -->
  <g stroke="#d2c198" stroke-width="1.6" stroke-linecap="round">
    <!-- gouged folds in the emperor's robe -->
    <line x1="478" y1="96" x2="490" y2="78"/>
    <line x1="486" y1="102" x2="496" y2="84"/>
    <line x1="494" y1="104" x2="500" y2="86"/>
    <!-- bright edge of the crown -->
    <line x1="483" y1="52" x2="495" y2="52"/>
    <!-- highlight on the cross-beam -->
    <line x1="503" y1="42" x2="535" y2="42"/>
    <!-- creases in the deputy's coat -->
    <line x1="416" y1="98" x2="424" y2="80"/>
    <line x1="424" y1="100" x2="430" y2="82"/>
    <!-- gleam on the sabre and horse flank -->
    <line x1="572" y1="24" x2="577" y2="38"/>
    <line x1="566" y1="96" x2="578" y2="80"/>
    <line x1="552" y1="64" x2="558" y2="58"/>
    <!-- spark of the grasping fist -->
    <line x1="475" y1="66" x2="481" y2="66"/>
  </g>
  <!-- base ground line + hatching -->
  <line x1="11" y1="110" x2="869" y2="110" stroke="#1c140f" stroke-width="2.5"/>
  <g stroke="#1c140f" stroke-width="0.8" opacity="0.4"><line x1="11" y1="115" x2="869" y2="115"/></g>
</svg>
